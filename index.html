<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DRIVELOAN PRO</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b14}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="driveloan-app" src="app.html" title="DRIVELOAN PRO"></iframe>
<script>
(function(){
  var frame=document.getElementById('driveloan-app');
  function parseMoney(line){var m=String(line||'').match(/₱([0-9,.]+)/);return m?m[1]:'';}
  function clean(v){return String(v||'').trim();}
  function activeCalc(doc){
    var text=doc.body&&doc.body.innerText||'';
    var m=text.match(/CALCULATOR\s*[—-]\s*([123])/);
    return m?Number(m[1]):1;
  }
  function inputNearLabel(doc,label){
    var els=doc.querySelectorAll('div,span');
    for(var i=0;i<els.length;i++){
      if(clean(els[i].textContent)===label){
        var p=els[i].parentElement;
        for(var depth=0;depth<4&&p;depth++,p=p.parentElement){
          var inp=p.querySelector('input');
          if(inp)return inp;
        }
      }
    }
    return null;
  }
  function transform(text,doc){
    if(typeof text!=='string'||text.indexOf('Unit: ')!==0||text.indexOf('Estimated computation only.')===-1)return text;
    var lines=text.split('\n'), d={};
    lines.forEach(function(line){
      var idx=line.indexOf(': '); if(idx<0)return;
      d[line.slice(0,idx)]=line.slice(idx+2);
    });
    var calc=activeCalc(doc);
    var variantInput=inputNearLabel(doc,'VEHICLE VARIANT');
    var unit=variantInput&&clean(variantInput.value)?clean(variantInput.value):(d['Unit']||'');
    var color=d['Color']||'Standard Color';
    var srp=parseMoney(d['Unit SRP']);
    var promo=parseMoney(d['Official Promo DP']);
    var add=parseMoney(d['Additional Cashout']);
    var net=parseMoney(d['Client Net DP']);
    var discount=parseMoney(d['Client Discount']);
    var total=parseMoney(d['Total DP']);
    var financed=parseMoney(d['Amount Financed']);
    var monthlyLine=lines.find(function(x){return x.indexOf('Monthly (')===0;})||'';
    var monthly=parseMoney(monthlyLine);
    var rateMatch=monthlyLine.match(/@\s*([0-9.]+)%/); var rate=rateMatch?rateMatch[1]:'';
    var desired=d['Client Desired DP']||'';
    var desiredAmount=parseMoney(desired);
    var desiredPct='';
    if(calc===2){
      var inp=inputNearLabel(doc,"CLIENT'S DESIRED DOWN PAYMENT %");
      if(inp&&inp.value!=='')desiredPct=Number(inp.value).toFixed(2)+'%';
      else {var pm=desired.match(/\(([0-9.]+)%\)/);desiredPct=pm?Number(pm[1]).toFixed(2)+'%':'';}
    }
    var addColor=color;
    if(addColor==='Standard Color')addColor='White Pearl';
    var addLabel='Additional Cashout for '+addColor+' Color: ₱'+add;
    var out=[];
    if(calc===1){
      out.push('Client Desired DP Amount: ₱'+desiredAmount);
      out.push('Unit: '+unit);
      out.push('Unit SRP: ₱'+srp);
      out.push('Official Promo DP: ₱'+promo);
      out.push('Color: '+color);
      out.push(addLabel);
      out.push('Client Net DP (Actual Client Cashout): ₱'+net);
      out.push('Client Discount: ₱'+discount);
      out.push('Total DP Deductible to Unit SRP: ₱'+total);
      out.push('Amount Financed: ₱'+financed);
      out.push('Monthly (5 Years): ₱'+monthly);
      out.push('Bank Interest Rate: '+rate+'%');
    } else if(calc===2){
      out.push('Client Desired DP (Percentage): '+desiredPct);
      out.push('Client Desired DP Amount: ₱'+desiredAmount);
      out.push('Unit: '+unit);
      out.push('Unit SRP: ₱'+srp);
      out.push('Official Promo DP: ₱'+promo);
      out.push('Color: '+color);
      out.push(addLabel);
      out.push('Client Net DP (Actual Client Cashout): ₱'+net);
      out.push('Client Discount: ₱'+discount);
      out.push('Total DP Deductible to Unit SRP: ₱'+total);
      out.push('Amount Financed: ₱'+financed);
      out.push('Monthly (5 Years): ₱'+monthly);
      out.push('Bank Interest Rate: '+rate+'%');
    } else {
      var required=desiredAmount;
      var termInput=doc.querySelector('select');
      var term=(termInput&&termInput.options[termInput.selectedIndex])?termInput.options[termInput.selectedIndex].text:'5 Years';
      var desiredMonthlyInput=inputNearLabel(doc,'DESIRED MONTHLY AMORTIZATION');
      var desiredMonthly=desiredMonthlyInput&&desiredMonthlyInput.value?Number(String(desiredMonthlyInput.value).replace(/[^0-9.]/g,'')):0;
      out.push('Client Desired Monthly (5 Years): ₱'+(desiredMonthly?Number(desiredMonthly).toLocaleString('en-US',{maximumFractionDigits:0}):monthly));
      out.push('Unit: '+unit);
      out.push('Color: '+color);
      out.push('Unit SRP: ₱'+srp);
      out.push('Official Promo DP: ₱'+promo);
      out.push('Client Required DP Amount: ₱'+required);
      out.push(addLabel);
      out.push('Client Net DP (Actual Client Cashout): ₱'+net);
      out.push('Client Discount: ₱'+discount);
      out.push('Total DP Deductible to Unit SRP: ₱'+total);
      out.push('Amount Financed: ₱'+financed);
      out.push('Monthly (5 Years): ₱'+monthly);
      out.push('Loan Term: '+term);
      out.push('Bank Interest Rate: '+rate+'%');
    }
    out.push('Estimated computation only. Subject to change without prior notice.');
    return out.join('\n');
  }
  function install(){
    var w=frame.contentWindow,doc=frame.contentDocument;
    if(!w||!doc||w.__dlClipboardPatch)return;
    w.__dlClipboardPatch=true;
    var nav=w.navigator;
    if(nav.clipboard&&typeof nav.clipboard.writeText==='function'){
      var original=nav.clipboard.writeText.bind(nav.clipboard);
      nav.clipboard.writeText=function(text){return original(transform(text,doc));};
    }
    var originalExec=doc.execCommand;
    doc.execCommand=function(command,show,value){
      if(command==='copy'){
        var active=doc.activeElement;
        if(active&&active.tagName==='TEXTAREA'&&active.value){active.value=transform(active.value,doc);}
      }
      return originalExec.apply(doc,arguments);
    };
  }
  frame.addEventListener('load',function(){install();setTimeout(install,50);setTimeout(install,250);});
})();
</script>
</body>
</html>
