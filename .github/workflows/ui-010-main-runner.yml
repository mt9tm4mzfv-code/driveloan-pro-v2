name: UI-010 Finalize Branch Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-ui-010:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Finalize UI-010 experimental branch
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(['git','fetch','origin','ui/next-update-010'], check=True)
          subprocess.run(['git','checkout','-B','ui/next-update-010','origin/ui/next-update-010'], check=True)

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          malformed = 'overflow-hidden,onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}"'
          corrected = 'overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}'
          if malformed not in text:
              raise SystemExit('UI-010 malformed wrapper marker not found')
          text = text.replace(malformed, corrected, 1)

          required = [
              'resetWasClicked',
              'ENTRY WAS RESET..',
              'onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}',
              'className:"flex flex-col gap-4 pt-0"',
              'marginTop:"0"'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'UI-010 verification failed: {marker}')
          if 'overflow-hidden,onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}"' in text:
              raise SystemExit('UI-010 malformed wrapper marker still present')

          path.write_text(text, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'], check=True)
          subprocess.run(['git','commit','-m','UI-010-RESET: finalize reset wrapper binding'], check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010'], check=True)
          print('UI-010 finalization verified and pushed')

      - name: Remove temporary runner from main
        shell: bash
        run: |
          git checkout main
          rm -f .github/workflows/ui-010-main-runner.yml
          git add .github/workflows/ui-010-main-runner.yml
          git commit -m "chore: remove temporary UI-010 runner"
          git push origin HEAD:main
