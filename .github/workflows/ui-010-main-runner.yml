name: UI-010 Controlled Branch Update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-ui-010:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Apply UI-010 to experimental branch
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(['git','fetch','origin','ui/next-update-010'], check=True)
          subprocess.run(['git','checkout','-B','ui/next-update-010','origin/ui/next-update-010'], check=True)

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_state = '[Qf,ru]=V.useState(!1),[Ho,Tr]=V.useState(null),[lu,Vf]=V.useState(!1),[uu,Bf]=V.useState(!1)'
          new_state = '[Qf,ru]=V.useState(!1),[Ho,Tr]=V.useState(null),[lu,Vf]=V.useState(!1),[uu,Bf]=V.useState(!1),[resetWasClicked,setResetWasClicked]=V.useState(!1)'
          if 'resetWasClicked' in text:
              raise SystemExit('UI-010 already present; refusing duplicate patch')
          if old_state not in text:
              raise SystemExit('UI-010 state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_wrapper = 'y("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf},children:y("div",{className:"p-4",children:'
          new_wrapper = 'y("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf},children:y("div",{className:"p-4",children:'
          if old_wrapper not in text:
              raise SystemExit('UI-010 wrapper anchor not found')
          text = text.replace(old_wrapper, new_wrapper, 1)

          old_actions = 'y("div",{className:"flex flex-col gap-0 pt-0",children:[y("button",{onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"-1.5rem"},children:"GENERATE AMORTIZATION COMPARO"}),p("div",{className:"h-4",children:null}),p("button",{onClick:()=>{Gf();window.alert("ENTRY RESET")},className:"bg-[#0f172a] rounded-[14px] py-2.5 px-5 text-[11px] font-black tracking-wide transition-transform active:translate-y-[2px]",style:{borderWidth:1,borderColor:Zf,color:Zf,boxShadow:`0 3px 0 ${Zf}`},children:"RESET ENTRY"})]})'
          new_actions = 'y("div",{className:"flex flex-col gap-4 pt-0",children:[y("button",{onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"0"},children:"GENERATE AMORTIZATION COMPARO"}),y("button",{onClick:()=>{Gf();setResetWasClicked(!0)},className:`w-full rounded-full py-2.5 px-5 text-[11px] font-black tracking-[0.12em] transition-all active:translate-y-[2px] ${resetWasClicked?"bg-[#2a0f12]":"bg-[#0f172a]"}`,style:{borderWidth:2,borderColor:resetWasClicked?"#ef4444":Zf,color:resetWasClicked?"#f87171":Zf,boxShadow:resetWasClicked?"0 3px 0 #991b1b, 0 0 16px rgba(239,68,68,0.35)":`0 3px 0 ${Zf}, 0 0 12px ${Zf}55`},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})]})'
          if old_actions not in text:
              raise SystemExit('UI-010 action block anchor not found')
          text = text.replace(old_actions, new_actions, 1)

          path.write_text(text, encoding='utf-8')

          for marker in ['resetWasClicked','ENTRY WAS RESET..','onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}','marginTop:"0"','className:"flex flex-col gap-4 pt-0"']:
              if marker not in text:
                  raise SystemExit(f'UI-010 verification failed: {marker}')
          print('UI-010 markers verified')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'], check=True)
          subprocess.run(['git','commit','-m','UI-010-RESET: theme reset state and uniform button spacing'], check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010'], check=True)

      - name: Remove temporary runner from main
        shell: bash
        run: |
          git checkout main
          rm -f .github/workflows/ui-010-main-runner.yml
          git add .github/workflows/ui-010-main-runner.yml
          git commit -m "chore: remove temporary UI-010 runner"
          git push origin HEAD:main
