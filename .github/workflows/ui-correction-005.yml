name: UI Correction 005
on:
  push:
    branches: [ui/next-update-005]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Calculator 3 heading and helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_h = 'DOWN PAYMENT → MONTHLY AMORTIZATION'
          new_h = 'MONTHLY AMORTIZATION → DOWN PAYMENT AMOUNT'
          old_q = 'Pila ang needed nga down payment para mag monthly og ₱${$f(un)}?'
          new_q = 'Para mag monthly ko og ₱25,000 pila akong DOWN PAYMENT?'
          if s.count(old_h) != 1:
              raise SystemExit(f'Expected exactly 1 heading occurrence, found {s.count(old_h)}')
          if s.count(old_q) != 1:
              raise SystemExit(f'Expected exactly 1 helper occurrence, found {s.count(old_q)}')
          s = s.replace(old_h, new_h, 1).replace(old_q, new_q, 1)
          p.write_text(s)
          print('Patched exactly one Calc 3 heading and one helper question.')
          PY
      - name: Commit UI correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'ui: correct Calculator 3 heading and helper text'
          git push
