name: Validate render fix v4
on:
  push:
    branches: [fix-live-render-v3-20260908]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Render and smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForTimeout(1800);
            const info=await page.evaluate(()=>{
              const root=document.getElementById('root');
              const ranges=[...document.querySelectorAll('input[type="range"]')];
              const calc=[...document.querySelectorAll('button')].filter(b=>/^CALC-0[123]$/.test((b.textContent||'').trim()));
              const frame=[...document.querySelectorAll('*')].find(el=>typeof el.className==='string'&&el.className.includes('rounded-[20px]'));
              return {text:root?root.innerText:'',children:root?root.children.length:0,ranges:ranges.length,accent:getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim(),buttons:calc.map(b=>({t:b.textContent.trim(),bg:getComputedStyle(b).backgroundColor})),frame:frame?{w:getComputedStyle(frame).borderLeftWidth,c:getComputedStyle(frame).borderLeftColor}:null};
            });
            console.log('INFO',JSON.stringify(info));
            if(info.children<1||info.ranges!==3||!info.text.includes('DRIVELOAN PRO')||info.accent!=='#4ade80'||!info.frame||info.frame.w!=='1px'||errors.length) throw new Error('validation failed: '+JSON.stringify({info,errors}));
            const buttons=page.locator('button');
            const calc2=buttons.filter({hasText:'2'}).filter({hasText:/^2$/});
            await page.getByRole('button',{name:'2',exact:true}).click(); await page.waitForTimeout(400);
            const a2=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim());
            await page.getByRole('button',{name:'3',exact:true}).click(); await page.waitForTimeout(400);
            const a3=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim());
            if(a2!=='#5aa8ff'||a3!=='#f59e0b') throw new Error('theme switching failed '+a2+' '+a3);
            if(errors.length) throw new Error('page errors '+errors.join(' | '));
            await page.screenshot({path:'render-v4-candidate.png',fullPage:true});
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: render-v4-candidate
          path: render-v4-candidate.png
