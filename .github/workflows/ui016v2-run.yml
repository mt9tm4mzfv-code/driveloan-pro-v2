name: UI-016 V2 Run
on:
  push:
    branches: [ui-016-v2-font-slider-capsule-fix]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ui016v2_apply.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/module.js').write_text(s[a:b])
          assert s.count('UI-016-V2-PREMIUM')==1
          assert s.count('UI-016-V2-BINDER')==1
          assert s.count('Vios XLE CVT')>=2
          assert s.count('type:"range",min:500000,max:3000000')==1
          print('STATIC OK',len(s))
          PY
          node --check /tmp/module.js
      - run: |
          git config user.name "Jude@Github2026"
          git config user.email "jude.dante@gmail.com"
          rm -f tools/ui016v2_apply.py .github/workflows/ui016v2-run.yml .github/workflows/ui016v2-inspect.yml
          git add index.html tools/ui016v2_apply.py .github/workflows/ui016v2-run.yml .github/workflows/ui016v2-inspect.yml
          git diff --cached --check
          git commit -m "UI-016 V2: font slider capsule and limitation fixes"
          git push origin HEAD:ui-016-v2-font-slider-capsule-fix
