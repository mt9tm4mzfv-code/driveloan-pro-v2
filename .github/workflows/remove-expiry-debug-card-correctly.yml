name: Remove expiry debug card correctly

on:
  push:
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove entire expiry debug card safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          marker = 'Supabase alter table profiles alter column offline_grace_days set default 30'

          if marker not in s:
              raise SystemExit('FAIL: target marker not found')

          def skip_string(text, i):
              q = text[i]
              i += 1
              while i < len(text):
                  c = text[i]
                  if c == '\\':
                      i += 2
                      continue
                  if c == q:
                      return i + 1
                  i += 1
              raise ValueError('unterminated string')

          def skip_template(text, i):
              i += 1
              while i < len(text):
                  c = text[i]
                  if c == '\\':
                      i += 2
                      continue
                  if c == '`':
                      return i + 1
                  i += 1
              raise ValueError('unterminated template')

          def find_matching_call(text, start):
              # start points at y( in y("div",{...})
              paren = 0
              brace = 0
              bracket = 0
              i = start
              while i < len(text):
                  c = text[i]
                  if c in ('"', "'"):
                      i = skip_string(text, i)
                      continue
                  if c == '`':
                      i = skip_template(text, i)
                      continue
                  if c == '(':
                      paren += 1
                  elif c == ')':
                      paren -= 1
                      if paren == 0:
                          return i + 1
                  elif c == '{':
                      brace += 1
                  elif c == '}':
                      brace -= 1
                  elif c == '[':
                      bracket += 1
                  elif c == ']':
                      bracket -= 1
                  i += 1
              raise ValueError('unbalanced call')

          # Find the nearest preceding y("div",{ opening that encloses the marker.
          marker_pos = s.index(marker)
          candidates = []
          needle = 'y("div",{'
          pos = 0
          while True:
              p = s.find(needle, pos, marker_pos)
              if p < 0:
                  break
              candidates.append(p)
              pos = p + 1

          if not candidates:
              raise SystemExit('FAIL: enclosing div opener not found')

          target_start = None
          target_end = None
          for p in reversed(candidates):
              try:
                  end = find_matching_call(s, p)
              except ValueError:
                  continue
              if end > marker_pos:
                  target_start, target_end = p, end
                  break

          if target_start is None:
              raise SystemExit('FAIL: could not resolve enclosing expiry card')

          # Remove the call and one adjacent comma when present.
          left = target_start
          right = target_end
          if right < len(s) and s[right] == ',':
              right += 1
          elif left > 0 and s[left-1] == ',':
              left -= 1

          new = s[:left] + s[right:]

          forbidden = [
              'offline_grace_days 30',
              'Supabase alter table profiles alter column offline_grace_days set default 30',
              '2-LEVEL EXPIRY',
              'Level1 Account Expiry',
              'Level2 Offline Verification 30 days',
              'RENEW NOW 15 SECS ONLINE',
          ]
          for x in forbidden:
              if x in new:
                  raise SystemExit(f'FAIL: forbidden marker remains: {x}')

          if 'NOW Valid Until Oct 03 2026' not in new:
              raise SystemExit('FAIL: current validity row was removed unexpectedly')
          if 'DRIVELOAN PRO' not in new:
              raise SystemExit('FAIL: main UI marker missing')

          path.write_text(new, encoding='utf-8')
          print('PASS: removed the entire enclosing expiry debug card')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S)
          if not scripts:
              raise SystemExit('FAIL: no script found')
          for i, code in enumerate(scripts):
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(code)
                  name = f.name
              r = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr)
                  raise SystemExit(f'FAIL: node syntax check failed for script {i}')
          print('PASS: JavaScript syntax valid')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-expiry-debug-card-correctly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-expiry-debug-card-correctly.yml
          git diff --cached --quiet && { echo 'FAIL: no changes staged'; exit 1; }
          git commit -m 'ui: correctly remove expiry debug UI'
          git push origin main
