name: UI Fix 012

on:
  page_build:
  workflow_dispatch:

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply final measured structural spacing fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_parent = 'className:"flex flex-col gap-2 pt-2"'
          new_parent = 'className:"flex flex-col gap-0 pt-0"'
          old_button = 'onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em] mt-3",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"-3rem"}'
          new_button = 'onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"-1.5rem"}'
          if s.count(old_parent) != 1:
              raise SystemExit(f'Expected exactly one parent layout marker; found {s.count(old_parent)}')
          if s.count(old_button) != 1:
              raise SystemExit(f'Expected exactly one Generate button marker; found {s.count(old_button)}')
          s = s.replace(old_parent, new_parent, 1)
          s = s.replace(old_button, new_button, 1)
          p.write_text(s, encoding='utf-8')
          print('Applied final measured fix: parent gap 0 / padding-top 0; Generate class mt-3 removed; inline margin-top -1.5rem.')

      - name: Verify source patch
        shell: bash
        run: |
          grep -F 'className:"flex flex-col gap-0 pt-0"' index.html
          grep -F 'onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"-1.5rem"}' index.html
          ! grep -F 'marginTop:"-3rem"' index.html

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/driveloan-server.log 2>&1 &

      - name: Browser verify button geometry
        shell: bash
        run: |
          cat > verify-ui.js <<'EOF'
          const { chromium } = require('playwright');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByRole('button', { name: 'COPY SIMPLE COMPUTATION' }).waitFor({ state: 'visible', timeout: 30000 });
            await page.getByRole('button', { name: 'GENERATE AMORTIZATION COMPARO' }).waitFor({ state: 'visible', timeout: 30000 });
            const copy = await page.getByRole('button', { name: 'COPY SIMPLE COMPUTATION' }).boundingBox();
            const gen = await page.getByRole('button', { name: 'GENERATE AMORTIZATION COMPARO' }).boundingBox();
            if (!copy || !gen) throw new Error('Could not measure target buttons');
            const gap = gen.y - (copy.y + copy.height);
            console.log(JSON.stringify({copy, gen, gap}, null, 2));
            if (gap < 6 || gap > 20) throw new Error(`Button gap out of target range: ${gap}px`);
            if (gen.y < copy.y + copy.height) throw new Error(`Overlap detected: ${gap}px`);
            await page.screenshot({ path: 'ui-fix-012.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          NODE_PATH="$PWD/node_modules" node verify-ui.js

      - name: Commit verified fix and clean temporary files
        shell: bash
        run: |
          rm -f .github/workflows/ui-fix-012.yml .ui-fix-012-trigger .ui-fix-012-pagebuild-trigger .ui-fix-012-final-trigger .ui-fix-012-measured-trigger .ui-fix-012-final-measured-trigger verify-ui.js ui-fix-012.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: fix button spacing structurally'
          git push origin main
