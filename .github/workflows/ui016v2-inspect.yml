name: UI-016 V2 Inspect

on:
  push:
    branches:
      - ui-016-v2-font-slider-capsule-fix

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=[]
          out.append(f'SIZE {len(s)}')
          for term in ['Mitsubishi','Toyota','Brand','brand','Model','model','SRP','Unit Details','UNIT DETAILS','Vios','Fortuner','Hilux','Rush','input type="range"','Bank Interest Rate','Base Down Payment','Dealer Incentive']:
              hits=[m.start() for m in re.finditer(re.escape(term), s, re.I)]
              out.append(f'\nTERM {term} COUNT {len(hits)}')
              for p in hits[:8]:
                  out.append(s[max(0,p-700):min(len(s),p+1400)].replace('\\n',' '))
          Path('ui016v2-inspection.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui016v2-inspection
          path: |
            ui016v2-inspection.txt
            index.html
