name: UI-016 Final Proof V2
on:
  push:
    branches: [ui-016-final-proof-v2]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual-only Meta reference layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- UI-016-FINAL-PROOF-V2 -->'
          if marker in s:
              raise SystemExit('layer already present')
          css=r'''<style id="UI-016-FINAL-PROOF-V2">
          /* VISUAL ONLY: no fields, labels, calculations or event handlers are changed. */
          :root{--ui016-accent:#7ee0a0;--ui016-accent2:#5aa8ff;--ui016-bg:#0e1525;--ui016-card:#131c31;--ui016-track:#2a3655}
          body{background:#0e1525!important;color:#f8fafc!important}
          /* clean static header: preserve the existing header contents, remove fixed overlap */
          div.fixed.top-0.z-50{position:relative!important;top:auto!important;left:auto!important;transform:none!important;width:calc(100% - 40px)!important;max-width:520px!important;margin:0 auto!important}
          /* premium cards and controls */
          input:not([type="range"]),select{background:#080c18!important;border:1px solid #26334f!important;border-radius:22px!important;color:#f8fafc!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)!important}
          button{font-family:Inter,system-ui,sans-serif!important}
          /* Meta-like range geometry: dark track + accent progress + unmistakable white ring/thumb */
          input[type="range"]{height:30px!important;background:transparent!important;appearance:none!important;-webkit-appearance:none!important;touch-action:pan-y!important}
          input[type="range"]::-webkit-slider-runnable-track{height:8px!important;border-radius:999px!important;background:linear-gradient(to right,var(--ui016-accent) 0%,var(--ui016-accent) var(--range-p,50%),#2a3655 var(--range-p,50%),#2a3655 100%)!important;border:0!important}
          input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none!important;appearance:none!important;width:30px!important;height:30px!important;margin-top:-11px!important;border-radius:50%!important;background:#fff!important;border:3px solid #fff!important;box-shadow:0 0 0 3px var(--ui016-accent),0 0 12px 4px color-mix(in srgb,var(--ui016-accent) 55%,transparent)!important}
          input[type="range"]::-moz-range-track{height:8px!important;border-radius:999px!important;background:#2a3655!important;border:0!important}
          input[type="range"]::-moz-range-progress{height:8px!important;border-radius:999px!important;background:var(--ui016-accent)!important}
          input[type="range"]::-moz-range-thumb{width:24px!important;height:24px!important;border-radius:50%!important;background:#fff!important;border:3px solid #fff!important;box-shadow:0 0 0 3px var(--ui016-accent),0 0 12px 4px rgba(126,224,160,.55)!important}
          /* normal sample-question text */
          .italic{font-style:normal!important}
          /* calculator accent follows the existing calculator navigation state */
          body:has(.border-\[\#7ee0a0\]){--ui016-accent:#7ee0a0}
          body:has(.border-\[\#3b82f6\]){--ui016-accent:#5aa8ff}
          body:has(.border-\[\#f59e0b\]){--ui016-accent:#f59e0b}
          /* right-side position/status rail */
          #ui016-position-rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);width:4px;height:34vh;min-height:130px;max-height:280px;background:#30343d;border-radius:999px;z-index:9999;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
          #ui016-position-rail i{position:absolute;left:50%;top:0;width:10px;height:44px;transform:translate(-50%,0);border-radius:999px;background:#777d88;box-shadow:0 0 7px rgba(255,255,255,.08)}
          </style>'''
          js=r'''<script id="UI-016-FINAL-PROOF-V2-BINDER">
          (function(){
            function pct(el){
              var min=parseFloat(el.min||0), max=parseFloat(el.max||100), val=parseFloat(el.value||0);
              var p=max>min?((val-min)/(max-min))*100:0;
              el.style.setProperty('--range-p',p+'%');
            }
            function bind(){
              document.querySelectorAll('input[type="range"]').forEach(function(el){
                pct(el);
                if(!el.dataset.ui016v2){el.dataset.ui016v2='1';el.addEventListener('input',function(){pct(el)});}
              });
              var rail=document.getElementById('ui016-position-rail');
              if(!rail){rail=document.createElement('div');rail.id='ui016-position-rail';rail.innerHTML='<i></i>';document.body.appendChild(rail);}
              var i=rail.firstElementChild;
              var max=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
              var y=Math.min(1,Math.max(0,window.scrollY/max));
              i.style.top='calc('+y*100+'% - '+y*44+'px)';
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
            window.addEventListener('scroll',bind,{passive:true});
            new MutationObserver(bind).observe(document.documentElement,{subtree:true,childList:true});
          })();
          </script>'''
          s=s.replace('</head>',marker+css+js+'</head>')
          p.write_text(s)
          PY
      - name: Verify forbidden additions and visual hooks
        run: |
          grep -q 'UI-016-FINAL-PROOF-V2' index.html
          ! grep -qi 'Now supports Toyota\|Toyota.*Honda.*Custom brands\|Vios XLE CVT' index.html
          grep -q '::-webkit-slider-thumb' index.html
          grep -q 'ui016-position-rail' index.html
      - name: Commit proof branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI-016 final proof V2: slider ring and visual verification'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/ui016_final_proof_v2.yml
          git commit -m 'chore: remove temporary UI-016 proof workflow'
          git push
