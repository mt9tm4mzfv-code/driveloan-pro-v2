name: UI-016 Outer Frame Repair

on:
  push:
    branches:
      - ui-016-outer-frame-heading

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated UI repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          old_wrapper = 'y("div",{className:"max-w-[920px] mx-auto px-3 py-3",children:'
          new_wrapper = 'y("div",{className:"max-w-[920px] mx-auto px-3 py-3",style:{border:"1.5px solid "+Zf,borderRadius:"28px",padding:"14px",boxSizing:"border-box",backgroundColor:"rgba(8,12,18,0.18)"},children:'
          if old_wrapper not in s:
              raise SystemExit('wrapper marker not found')
          s = s.replace(old_wrapper, new_wrapper, 1)

          start = s.find('y("div",{className:`fixed top-0')
          end_marker = 'y("div",{className:"mt-3 bg-[#131c31] border border-[#2a3655] rounded-[20px] p-4"'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('header markers not found')

          selector = '''y("div",{className:"w-fit mx-auto bg-[#0e1525]/80 rounded-full px-3 py-2 flex items-center justify-center border",style:{borderColor:e===1?"#1f6b3d":e===2?"#2563eb":"#f59e0b"},children:[y("div",{className:"flex items-center gap-2.5",children:[y("div",{className:"text-[12px] font-bold tracking-wide whitespace-nowrap",children:["CALCULATOR — ",e]}),p("div",{className:"h-5 w-px bg-[#475569]",children:null}),p("div",{className:"flex items-center gap-1.5",children:[1,2,3].map((L)=>p("button",{onClick:()=>{n(L),E(`Calculator ${L} active — ${L===1?"DP Amount→Monthly":L===2?"DP %→Monthly":"Monthly→DP"}`),setTimeout(()=>E(null),2500)},className:`w-7 h-7 rounded-full text-[12px] font-bold flex items-center justify-center transition-all ${e===L?(e===1?"bg-[#7ee0a0] text-black":e===2?"bg-[#5aa8ff] text-black":"bg-[#f59e0b] text-black"):"bg-[#2a3552] text-[#8a96b5]"}`,children:L},L))})]})]})'''

          new_header = '''y("div",{className:"mb-4",children:[y("div",{className:"flex items-start justify-between gap-3",children:[p("div",{className:"text-[32px] font-black leading-none tracking-tight text-white",children:"DRIVELOAN PRO"}),p("div",{className:"shrink-0 bg-[#0e1525]/80 border rounded-full px-3 py-2 text-[10px] font-bold tracking-wide text-[#94a3b8]",style:{borderColor:e===1?"#1f6b3d":e===2?"#2563eb":"#f59e0b"},children:"UI-016 REVISED • 0e08865"})]}),p("div",{className:"mt-3 flex justify-center",children:''' + selector + '''})]})},'''

          s = s[:start] + new_header + s[end:]

          old_card_style = 'style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf}'
          new_card_style = 'style:{border:"1px solid #2a3655"}'
          if old_card_style not in s:
              raise SystemExit('inner card border marker not found')
          s = s.replace(old_card_style, new_card_style, 1)

          path.write_text(s)
          PY

      - name: Commit repaired UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI-016: apply thin color-coded outer frame and revised heading"
          git push

      - name: Remove repair workflow
        shell: bash
        run: |
          git rm .github/workflows/ui016-outer-frame.yml
          git commit -m "chore: remove temporary UI-016 repair workflow"
          git push
