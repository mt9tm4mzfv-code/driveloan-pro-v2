name: UI Next Update 002

on:
  push:
    branches:
      - ui/next-update-002

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Inspect calculator source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['Down Payment Amount','Down Payment %','Monthly → Down Payment','Monthly →','XPANDER CROSS']:
              print('\n===',needle,'===')
              i=s.find(needle)
              print(s[max(0,i-900):i+1600] if i>=0 else 'NOT FOUND')
          PY
          exit 1
