name: UI Next Update 002

on:
  push:
    branches:
      - ui/next-update-002

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Inspect current source patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for label, pat in [
            ('DOWN150', r'.{0,300}150.{0,500}'),
            ('DOWN10', r'.{0,300}10\.00%.{0,500}'),
            ('DOWN25', r'.{0,300}25,000.{0,500}'),
            ('PREMIUM', r'.{0,300}Premium enabled.{0,500}'),
            ('RESET', r'.{0,300}RESET ENTRY.{0,300}'),
          ]:
            print('\n===',label,'===')
            m=re.search(pat,s,re.S)
            print(m.group(0) if m else 'NOT FOUND')
          PY
          exit 1
