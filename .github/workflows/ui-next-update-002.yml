name: UI Next Update 002

on:
  push:
    branches:
      - ui/next-update-002

permissions:
  contents: write

jobs:
  apply-ui-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply requested UI-only changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # 1) Color-code the Premium ON badge to the active calculator accent.
          old_on = 'className:"bg-[#60a5fa] text-black font-black text-[10px] px-3 py-1 rounded-full tracking-wide",children:"ON"'
          new_on = 'className:"text-black font-black text-[10px] px-3 py-1 rounded-full tracking-wide",style:{backgroundColor:l},children:"ON"'
          if old_on not in s:
              raise SystemExit('ABORT: Premium ON badge source pattern not found')
          s = s.replace(old_on, new_on, 1)

          # 2) Color-code each calculator helper question and apply the exact requested wording.
          replacements = [
              ('Kung mag Down Payment ko og ₱150,000, pila akong monthly?', 'Kung mag Down Payment ko og ₱150,000 pila akong monthly?'),
              ('Kung mag Down Payment ko og 10.00%, pila akong monthly?', 'Kung mag Down Payment ko og 30.00%, pila akong monthly?'),
              ('Kung kaya nako ₱25,000 monthly, pila needed DP?', 'Pila ang needed nga down payment para mag monthly og ₱25,000?'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'ABORT: helper text not found: {old}')
              s = s.replace(old, new, 1)

          old_helper = 'className:"text-[12px] italic text-[#7ee0a0] mt-1",children:jf'
          new_helper = 'className:"text-[12px] italic mt-1",style:{color:l},children:jf'
          if old_helper not in s:
              raise SystemExit('ABORT: helper color source pattern not found')
          s = s.replace(old_helper, new_helper, 1)

          # 3) Increase the dark-space gap before RESET ENTRY.
          old_reset = 'className:"w-full rounded-[12px] py-3 text-[11px] font-bold tracking-widest border border-slate-700/60 text-slate-500 hover:bg-slate-800/60 hover:text-slate-300 transition",children:"RESET ENTRY"'
          if old_reset not in s:
              raise SystemExit('ABORT: RESET ENTRY source pattern not found')
          new_reset = 'className:"w-fit min-w-[180px] mx-auto rounded-[14px] py-2.5 px-6 text-[11px] font-black tracking-widest border transition-all active:translate-y-[2px]",style:{color:l,borderColor:l,boxShadow:`0 3px 0 ${l}`},onClick:()=>{N();window.alert("ENTRY RESET")},children:"RESET ENTRY"'
          s = s.replace(old_reset, new_reset, 1)

          # Only change the mt-5 wrapper immediately before RESET ENTRY to mt-10.
          marker = 'f("div",{className:"mt-5",children:f("button",{onClick:N'
          if marker not in s:
              raise SystemExit('ABORT: RESET wrapper spacing pattern not found')
          s = s.replace(marker, 'f("div",{className:"mt-10",children:f("button",{onClick:N', 1)

          # 4) Reset button confirmation is handled directly by the button click above.
          if s == original:
              raise SystemExit('ABORT: no changes made')

          path.write_text(s, encoding='utf-8')
          print('UI UPDATE 002 APPLIED')
          PY

      - name: Validate requested UI strings and structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'Kung mag Down Payment ko og ₱150,000 pila akong monthly?',
              'Kung mag Down Payment ko og 30.00%, pila akong monthly?',
              'Pila ang needed nga down payment para mag monthly og ₱25,000?',
              'style:{color:l},children:jf',
              'style:{backgroundColor:l},children:"ON"',
              'window.alert("ENTRY RESET")',
              'className:"mt-10",children:f("button"',
              'w-fit min-w-[180px] mx-auto',
              'boxShadow:`0 3px 0 ${l}`',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('VALIDATION FAILED: ' + ' | '.join(missing))
          print('VALIDATION PASSED')
          PY

      - name: Commit UI update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: refine calculator helper text and reset control" || exit 1
          git push

      - name: Remove temporary workflow from branch
        if: success()
        run: |
          git rm .github/workflows/ui-next-update-002.yml
          git commit -m "chore: remove temporary UI update workflow"
          git push
