name: UI Next Update 002

on:
  push:
    branches:
      - ui/next-update-002

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Inspect current source patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          print('=== EXAMPLES ===')
          for m in re.finditer(r'example.{0,500}',s,re.I):
              print(m.group(0))
              print('---')
              if s[:m.start()].count('example') >= 6:
                  break
          print('=== RESET BLOCK ===')
          m=re.search(r'GENERATE AMORTIZATION COMPARISON.{0,1200}RESET ENTRY',s,re.S)
          print(m.group(0) if m else 'NOT FOUND')
          print('=== HELPER COMPONENT ===')
          m=re.search(r'italic.{0,250}children:jf',s,re.S)
          print(m.group(0) if m else 'NOT FOUND')
          PY
          exit 1
