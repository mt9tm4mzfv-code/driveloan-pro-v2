name: UI-020 controlled apply
on:
  push:
    branches:
      - future-update-point-ui020-2026-09-08
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI-020
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '</head>'
          assert marker in s
          assert 'UI-020-COLOR-CODED-FIELD-LABELS' not in s
          block = '''<style id="UI-020-COLOR-CODED-FIELD-LABELS">
          .dl-ui020-field-label{color:var(--dl-accent,#5aa8ff)!important;font-weight:700!important;-webkit-font-smoothing:antialiased!important;-moz-osx-font-smoothing:grayscale!important}
          </style>
          <script id="UI-020-COLOR-CODED-FIELD-LABELS-BINDER">
          (function(){
            var labels=new Set(['VEHICLE VARIANT','UNIT SRP','OFFICIAL PROMO DP','PREMIUM COLOR? • SURCHARGE = ADD CASHOUT','COLOR NAME','PREMIUM AMOUNT','LOAN TERM','BANK INTEREST RATE (%)','BASE DOWN PAYMENT (%)',"DEALER'S INCENTIVE RATE (%)","CLIENT'S DESIRED DOWN PAYMENT AMOUNT","CLIENT'S DESIRED DOWN PAYMENT %",'DESIRED MONTHLY AMORTIZATION','REQUIRED DOWN PAYMENT','MONTHLY AMORTIZATION']);
            function apply(){document.querySelectorAll('div').forEach(function(el){if(el.children.length!==0)return;var txt=(el.textContent||'').trim();if(!labels.has(txt))return;if(!el.className||String(el.className).indexOf('text-[10px]')===-1)return;el.classList.add('dl-ui020-field-label')})}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
          })();
          </script>
          '''
          p.write_text(s.replace(marker, block + marker, 1))
          PY
      - name: Commit UI and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI-020: color-code calculator field titles'
          git rm .github/workflows/ui020-label-colorcode.yml
          git commit -m 'UI-020 cleanup: remove temporary workflow'
          git push origin HEAD:future-update-point-ui020-2026-09-08
