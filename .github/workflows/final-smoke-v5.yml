name: Final DriveLoan smoke test
on:
  push:
    branches: [fix-live-render-v3-20260908]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Validate render, themes and calculation output
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForTimeout(1800);
            const base=await page.evaluate(()=>{
              const root=document.getElementById('root');
              const ranges=document.querySelectorAll('input[type="range"]').length;
              const frame=[...document.querySelectorAll('*')].find(el=>typeof el.className==='string'&&el.className.includes('rounded-[20px]'));
              return {text:root?.innerText||'',children:root?.children.length||0,ranges,accent:getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim(),frame:frame?getComputedStyle(frame).borderLeftWidth:null};
            });
            console.log('BASE',JSON.stringify(base));
            if(base.children<1||base.ranges!==3||!base.text.includes('DRIVELOAN PRO')||base.accent!=='#4ade80'||base.frame!=='1px')throw new Error('base render/theme/frame failed');
            const one=page.getByRole('button',{name:'1',exact:true}),two=page.getByRole('button',{name:'2',exact:true}),three=page.getByRole('button',{name:'3',exact:true});
            await two.click();await page.waitForTimeout(350);const a2=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim());
            await three.click();await page.waitForTimeout(350);const a3=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim());
            await one.click();await page.waitForTimeout(350);const a1=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--dl-accent').trim());
            console.log('THEMES',a1,a2,a3);
            if(a1!=='#4ade80'||a2!=='#5aa8ff'||a3!=='#f59e0b')throw new Error('theme switching failed');
            const text=await page.locator('#root').innerText();
            if(!text.includes('28,896.00'))throw new Error('calculation output regression');
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            await page.screenshot({path:'final-smoke.png',fullPage:true});
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: final-driveLoan-smoke
          path: final-smoke.png
