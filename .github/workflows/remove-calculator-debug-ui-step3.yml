name: Remove calculator debug UI Step 3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove requested presentation-only debug UI
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          original = s
          markers = [
              'children:["₱",N(l)," muted"]',
              'children:[a.toFixed(2),"% • step 0.01',
              'children:["Base amount: ₱",N(R*(g/100))',
              'children:["Incentive amount: ₱",N(ae.DealerDisplay)',
              'children:"PRIMARY"',
              'children:["₱",N(I)]',
          ]

          def matching_end(text, start):
              depth = 0; quote = None; template = False; i = start
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if ch == "\\": i += 2; continue
                      if ch == quote: quote = None
                      i += 1; continue
                  if ch in ('"', "'"): quote = ch; i += 1; continue
                  if ch == '`': template = not template; i += 1; continue
                  if not template:
                      if ch == '(': depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0: return i + 1
                  i += 1
              return None

          def remove_nearest_call(text, marker):
              pos = text.find(marker)
              if pos < 0: return text, False
              candidates = []
              for opener in ('y("div",{', 'p("div",{', 'p("span",{', 'y("span",{'):
                  start = text.rfind(opener, 0, pos + 1)
                  while start >= 0:
                      end = matching_end(text, start + 1)
                      if end is not None and end > pos:
                          candidates.append((start, end)); break
                      start = text.rfind(opener, 0, start)
              if not candidates: raise SystemExit(f'No enclosing presentation node found: {marker}')
              start, end = max(candidates, key=lambda x: x[0])
              a = start
              while a > 0 and text[a-1].isspace(): a -= 1
              b = end
              while b < len(text) and text[b].isspace(): b += 1
              if a > 0 and text[a-1] == ',': return text[:a-1] + text[end:], True
              if b < len(text) and text[b] == ',': return text[:start] + text[b+1:], True
              return text[:start] + text[end:], True

          def remove_monthly_debug_ternary(text):
              marker = 'e===2?y("div",{className:"text-[10px] text-[#7a859e] mt-2 leading-[1.6] break-words"'
              pos = text.find(marker)
              if pos < 0: return text, False
              first_y = text.find('y("div",{', pos)
              first_end = matching_end(text, first_y + 1)
              if first_end is None: raise SystemExit('Monthly debug first branch not balanced')
              colon = text.find(':y("div",{', first_end)
              if colon < 0: raise SystemExit('Monthly debug second branch not found')
              second_y = colon + 1
              second_end = matching_end(text, second_y + 1)
              if second_end is None: raise SystemExit('Monthly debug second branch not balanced')
              a = pos
              while a > 0 and text[a-1].isspace(): a -= 1
              b = second_end
              while b < len(text) and text[b].isspace(): b += 1
              if a > 0 and text[a-1] == ',': return text[:a-1] + text[second_end:], True
              if b < len(text) and text[b] == ',': return text[:pos] + text[b+1:], True
              return text[:pos] + text[second_end:], True

          removed = []
          for marker in markers:
              while marker in s:
                  s, changed = remove_nearest_call(s, marker)
                  if not changed: raise SystemExit(f'Failed to remove marker: {marker}')
                  removed.append(marker)

          monthly_marker = 'e===2?y("div",{className:"text-[10px] text-[#7a859e] mt-2 leading-[1.6] break-words"'
          while monthly_marker in s:
              s, changed = remove_monthly_debug_ternary(s)
              if not changed: raise SystemExit('Failed to remove monthly debug ternary')
              removed.append(monthly_marker)

          for marker in markers + [monthly_marker]:
              if marker in s: raise SystemExit(f'Marker still present: {marker}')
          for required in ['DRIVELOAN PRO','Down Payment Amount','PREMIUM COLOR?','OFFICIAL PROMO DP']:
              if required not in s: raise SystemExit(f'Safety check failed: {required} missing')
          for required in ['NOW Valid Until Oct 03 2026','navigator.clipboard','RESET ENTRY']:
              if required not in s: raise SystemExit(f'Underlying functionality marker missing: {required}')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for idx, script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(script); name = f.name
              r = subprocess.run(['node','--check',name], capture_output=True, text=True)
              if r.returncode != 0: raise SystemExit(f'JavaScript syntax failed in script {idx}: {r.stderr}')

          path.write_text(s, encoding='utf-8')
          print(f'Removed {len(removed)} presentation-only nodes')
          for item in removed: print(item)
          print(f'Bytes: {len(original.encode())} -> {len(s.encode())}')

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-calculator-debug-ui-step3.yml
          git commit -m "ui: remove calculator debug helper display"
          git push origin main
