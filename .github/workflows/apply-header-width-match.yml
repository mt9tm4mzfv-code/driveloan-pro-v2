name: Apply header width match

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match floating header width to body
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'w-[calc(100%-24px)] max-w-[980px]'
          new = 'w-[calc(100%-32px)] max-w-[980px]'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 header width target, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Header width changed: 100%-24px -> 100%-32px')

      - name: Commit UI change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: Match floating header width to body borders"
          git push origin HEAD:main
          rm -f .github/workflows/apply-header-width-match.yml
          git add -u .github/workflows/apply-header-width-match.yml
          git commit -m "Remove temporary header width workflow"
          git push origin HEAD:main
