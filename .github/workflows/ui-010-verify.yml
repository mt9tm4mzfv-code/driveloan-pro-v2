name: UI-010 Verify

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify UI-010 and JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          text = Path('index.html').read_text(encoding='utf-8')
          assert '[resetWasClicked,setResetWasClicked]=V.useState(!1)' in text
          assert 'className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},style:' in text
          assert 'overflow-hidden,onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}' not in text
          assert 'resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"' in text
          assert 'className:"flex flex-col gap-4 pt-0"' in text
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          assert len(scripts) == 1
          Path('/tmp/driveloan-module.js').write_text(scripts[0], encoding='utf-8')
          subprocess.run(['node','--check','/tmp/driveloan-module.js'], check=True)
          print('UI-010 assertions: PASS')
          print('JavaScript syntax: PASS')
      - name: Clean verification workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ui-010-verify.yml UI-010-VERIFY-TRIGGER.txt
          git commit -m "UI-010 DEBUG: verification complete"
          git push origin HEAD:ui/next-update-010-fix
