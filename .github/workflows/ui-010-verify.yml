name: UI-010 Verify

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare baseline and UI-010 syntax
        shell: bash
        run: |
          set +e
          git fetch --no-tags origin cc61a126840a5cfcfe147cb88042b717a6e5357a --depth=1
          git show cc61a126840a5cfcfe147cb88042b717a6e5357a:index.html > /tmp/base.html
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['/tmp/base.html','index.html']:
              text=Path(name).read_text(encoding='utf-8')
              js=re.findall(r'<script type="module">(.*?)</script>',text,re.S)[0]
              Path('/tmp/test.js').write_text(js,encoding='utf-8')
              import subprocess
              r=subprocess.run(['node','--check','/tmp/test.js'],capture_output=True,text=True)
              print(name, 'NODE_CHECK=', r.returncode)
              print(r.stderr[:3000])
          PY
      - name: Clean verification workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ui-010-verify.yml UI-010-VERIFY-TRIGGER.txt
          git commit -m "UI-010 DEBUG: syntax comparison complete"
          git push origin HEAD:ui/next-update-010-fix
