name: UI-010 Verify

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UI-010 syntax failure
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          text = Path('index.html').read_text(encoding='utf-8')
          i = text.find('resetWasClicked')
          print('FIRST resetWasClicked INDEX:', i)
          print('CONTEXT:', repr(text[max(0,i-500):i+1000]))
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          assert len(scripts) == 1
          js = scripts[0]
          Path('/tmp/driveloan-module.js').write_text(js, encoding='utf-8')
          result = subprocess.run(['node','--check','/tmp/driveloan-module.js'], text=True, capture_output=True)
          print('NODE CHECK RETURN:', result.returncode)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
      - name: Clean verification workflow
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ui-010-verify.yml UI-010-VERIFY-TRIGGER.txt
          git commit -m "UI-010 DEBUG: verification complete"
          git push origin HEAD:ui/next-update-010-fix
