name: UI-010 Safe Fix

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and clean UI-010 fix
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          malformed = 'overflow-hidden,onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}",style:'
          correct = 'overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},style:'
          if malformed in text:
              text = text.replace(malformed, correct, 1)
          elif correct in text:
              pass
          else:
              raise SystemExit('UI-010 wrapper binding not found')
          if correct not in text:
              raise SystemExit('correct wrapper binding verification failed')
          if 'resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"' not in text:
              raise SystemExit('reset state implementation missing')
          path.write_text(text, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'])
          subprocess.run(['git','rm','.github/workflows/ui-010-fix.yml'], check=True)
          subprocess.run(['git','rm','UI-010-FIX-TRIGGER.txt'], check=True)
          subprocess.run(['git','commit','-m','UI-010 DEBUG: finalize safe reset binding'], check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010-fix'], check=True)
