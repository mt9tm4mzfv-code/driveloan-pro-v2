name: UI-010 Safe Fix

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Correct UI-010 wrapper binding
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'overflow-hidden,onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}",style:'
          new = 'overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},style:'
          if old not in text:
              raise SystemExit('expected malformed UI-010 wrapper not found')
          text = text.replace(old, new, 1)
          if old in text or new not in text:
              raise SystemExit('wrapper verification failed')
          if 'resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"' not in text:
              raise SystemExit('reset state implementation missing')
          path.write_text(text, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'])
          subprocess.run(['git','rm','.github/workflows/ui-010-fix.yml'])
          subprocess.run(['git','rm','UI-010-FIX-TRIGGER.txt'])
          subprocess.run(['git','commit','-m','UI-010 DEBUG: correct reset wrapper binding'], check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010-fix'], check=True)
