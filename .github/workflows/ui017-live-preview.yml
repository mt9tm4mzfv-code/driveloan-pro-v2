name: UI-016 V2 Live Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui016v2-live-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout UI-016 V2 branch
        uses: actions/checkout@v4
        with:
          ref: ui-016-v2-font-slider-capsule-fix
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload UI-016 V2 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy UI-016 V2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
