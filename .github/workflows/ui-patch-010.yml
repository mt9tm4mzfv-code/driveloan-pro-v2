name: UI Patch 010
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove excessive negative margin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'marginRight:"1rem",marginTop:"-4rem"'
          new = 'marginRight:"1rem"'
          if old not in s:
              raise SystemExit('Target spacing patch not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "Jude@Github2026"
          git config user.email "jude.dante@gmail.com"
          git add index.html
          git commit -m "ui: remove excessive negative margin from amortization button"
          git push
