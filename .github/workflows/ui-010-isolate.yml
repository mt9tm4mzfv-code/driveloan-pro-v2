name: UI-010 Isolate

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  isolate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Isolate syntax-breaking UI-010 change
        shell: bash
        run: |
          set -e
          git fetch --no-tags origin cc61a126840a5cfcfe147cb88042b717a6e5357a --depth=1
          git show cc61a126840a5cfcfe147cb88042b717a6e5357a:index.html > /tmp/base.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          base=Path('/tmp/base.html').read_text(encoding='utf-8')
          cur=Path('index.html').read_text(encoding='utf-8')
          def js(t): return re.findall(r'<script type="module">(.*?)</script>',t,re.S)[0]
          b=js(base); c=js(cur)
          variants={'current':c}
          state='[resetWasClicked,setResetWasClicked]=V.useState(!1),'
          variants['no_state']=c.replace(state,'',1)
          bs='p("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] p-4",'
          cs='p("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},'
          variants['no_wrapper']=c.replace(cs,bs,1)
          astart=c.find('y("div",{className:"flex flex-col gap-4 pt-0",children:')
          aend=c.find('}),y("div",{className:"mt-6 bg-[#080c18]',astart)
          bstart=b.find('y("div",{className:"flex flex-col gap-0 pt-0",children:')
          bend=b.find('}),y("div",{className:"mt-6 bg-[#080c18]',bstart)
          if min(astart,aend,bstart,bend)<0: raise SystemExit('action block anchors not found')
          baseline_action=b[bstart:bend+2]
          variants['no_actions']=c[:astart]+baseline_action+c[aend+2:]
          for name,text in variants.items():
              Path('/tmp/test.js').write_text(text,encoding='utf-8')
              r=subprocess.run(['node','--check','/tmp/test.js'],capture_output=True,text=True)
              print(name, 'RETURN', r.returncode)
              if r.returncode: print(r.stderr[:900])
          PY
      - name: Clean isolation workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ui-010-isolate.yml
          git commit -m "UI-010 DEBUG: isolate syntax change"
          git push origin HEAD:ui/next-update-010-fix
