name: UI-017 Inspect
on:
  push:
    branches: ["ui/next-update-017-header-cleanup"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sample questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for needle in ['italic','Para mag monthly','pila akong DOWN PAYMENT','pila akong MONTHLY']:
              print('\n===',needle,'===')
              for m in list(re.finditer(re.escape(needle),s,re.I))[:10]:
                  p=m.start(); print(s[max(0,p-700):p+1200])
          PY