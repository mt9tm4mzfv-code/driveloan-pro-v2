name: Apply theme render fix v2
on:
  push:
    branches: [fix-theme-render-v2-20260908]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI-only theme binder and frame
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pat=r'<script id="DRIVELOAN-THEME-ZOOM-BINDER">.*?</script>'
          replacement='''<script id="DRIVELOAN-THEME-ZOOM-BINDER">
          (function(){
            function theme(){
              var t='';
              document.querySelectorAll('button').forEach(function(b){
                var txt=(b.textContent||'').trim();
                if(!/^CALC-0[123]$/.test(txt)) return;
                var active=b.getAttribute('aria-current')==='true'||b.getAttribute('aria-pressed')==='true'||b.getAttribute('data-state')==='active';
                var bg=getComputedStyle(b).backgroundColor;
                if(active || bg==='rgb(126, 224, 160)' || bg==='rgb(134, 239, 172)' || bg==='rgb(90, 168, 255)' || bg==='rgb(245, 158, 11)') t=txt;
              });
              if(!t) t='CALC-01';
              var a=t==='CALC-01'?'#4ade80':t==='CALC-03'?'#f59e0b':'#5aa8ff';
              var g=t==='CALC-01'?'rgba(74,222,128,.55)':t==='CALC-03'?'rgba(245,158,11,.55)':'rgba(90,168,255,.55)';
              var so=t==='CALC-01'?'rgba(74,222,128,.18)':t==='CALC-03'?'rgba(245,158,11,.18)':'rgba(90,168,255,.18)';
              document.documentElement.style.setProperty('--dl-accent',a);
              document.documentElement.style.setProperty('--dl-glow',g);
              document.documentElement.style.setProperty('--dl-soft',so);
              document.querySelectorAll('input[type="range"]').forEach(function(el){
                el.classList.add('dl-theme-slider');
                var min=Number(el.min||0),max=Number(el.max||100),val=Number(el.value||0),pct=max===min?0:((val-min)/(max-min))*100;
                el.style.background='linear-gradient(to right,'+a+' 0%,'+a+' '+pct+'%,#2b3446 '+pct+'%,#2b3446 100%)';
              });
              document.querySelectorAll('button').forEach(function(b){
                var txt=(b.textContent||'').trim(),p=b.parentElement;
                if((txt==='ON'||txt==='OFF')&&p&&/PREMIUM COLOR SURCHARGE|PREMIUM COLOR/i.test((p.parentElement||p).textContent||'')){
                  if(txt==='ON') b.classList.add('dl-theme-control'); else b.classList.remove('dl-theme-control');
                }
              });
            }
            function apply(){try{theme();}catch(e){console.error('DriveLoan theme binder:',e);}}
            function boot(){
              apply();
              var n=0;
              var timer=setInterval(function(){apply();if(++n>=20)clearInterval(timer);},250);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            document.addEventListener('click',function(){setTimeout(apply,0);},{passive:true});
            document.addEventListener('input',apply,{passive:true});
            document.addEventListener('change',apply,{passive:true});
          })();
          </script>'''
          ns,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('theme binder not found exactly once')
          old='style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf}'
          new='style:{borderWidth:1,borderColor:"#2a3655"}'
          if old not in ns: raise SystemExit('calculator frame style not found')
          ns=ns.replace(old,new,1)
          p.write_text(ns)
          print('patched theme binder + calculator frame')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'Jude@Github2026'
          git config user.email 'jude.dante@gmail.com'
          git add index.html
          git commit -m 'FIX: stabilize calculator theme rendering and neutralize frame'
          rm -f .github/workflows/apply-theme-fix-v2.yml
          git add .github/workflows/apply-theme-fix-v2.yml
          git commit -m 'chore: remove temporary theme fix workflow'
          git push origin HEAD:fix-theme-render-v2-20260908
