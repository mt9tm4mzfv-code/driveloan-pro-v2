name: UI-010 Final Fix
on:
  push:
    branches:
      - ui/next-update-010-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          git fetch --no-tags origin cc61a126840a5cfcfe147cb88042b717a6e5357a --depth=1
          git show cc61a126840a5cfcfe147cb88042b717a6e5357a:index.html > /tmp/base.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          base=Path('/tmp/base.html').read_text(encoding='utf-8')
          bjs=re.findall(r'<script type="module">(.*?)</script>',base,re.S)[0]
          start=bjs.find('y("div",{className:"flex flex-col gap-0 pt-0",children:')
          end=bjs.find(',y("div",{className:"mt-6 bg-[#080c18]',start)
          if start<0 or end<0: raise SystemExit('baseline action structure not found')
          action=bjs[start:end]
          action=action.replace('className:"flex flex-col gap-0 pt-0"','className:"flex flex-col gap-4 pt-0"',1)
          action=action.replace('marginTop:"-1.5rem"','marginTop:"0"',1)
          action=action.replace('p("div",{className:"h-4",children:null}),','',1)
          old_reset='p("button",{onClick:()=>{Gf();window.alert("ENTRY RESET")},className:"bg-[#0f172a] rounded-[14px] py-2.5 px-5 text-[11px] font-black tracking-wide transition-transform active:translate-y-[2px]",style:{borderWidth:1,borderColor:Zf,color:Zf,boxShadow:`0 3px 0 ${Zf}`},children:"RESET ENTRY"})'
          new_reset='y("button",{onClick:()=>{Gf();setResetWasClicked(!0)},className:`w-full rounded-full py-2.5 px-5 text-[11px] font-black tracking-[0.12em] transition-all active:translate-y-[2px] ${resetWasClicked?"bg-[#2a0f12]":"bg-[#0f172a]"}`,style:{borderWidth:2,borderColor:resetWasClicked?"#ef4444":Zf,color:resetWasClicked?"#f87171":Zf,boxShadow:resetWasClicked?"0 3px 0 #991b1b, 0 0 16px rgba(239,68,68,0.35)":`0 3px 0 ${Zf}, 0 0 12px ${Zf}55`},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})'
          if old_reset not in action: raise SystemExit('baseline reset button anchor not found')
          action=action.replace(old_reset,new_reset,1)
          cjs=re.findall(r'<script type="module">(.*?)</script>',text,re.S)[0]
          cur_start=cjs.find('y("div",{className:"flex flex-col gap-4 pt-0",children:')
          cur_end=cjs.find(',y("div",{className:"mt-6 bg-[#080c18]',cur_start)
          if cur_start<0 or cur_end<0: raise SystemExit('current action markers not found')
          text=text[:text.find('<script type="module">')+len('<script type="module">')+cur_start] + action + text[text.find('<script type="module">')+len('<script type="module">')+cur_end:]
          scripts=re.findall(r'<script type="module">(.*?)</script>',text,re.S)
          assert len(scripts)==1
          Path('/tmp/app.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/app.js'],check=True)
          assert '[resetWasClicked,setResetWasClicked]=V.useState(!1)' in text
          assert 'onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}' in text
          assert 'resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"' in text
          path.write_text(text,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','index.html'])
          subprocess.run(['git','rm','.github/workflows/ui-010-fix-syntax.yml'])
          subprocess.run(['git','commit','-m','UI-010 DEBUG: preserve baseline structure with safe reset state'],check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010-fix'],check=True)
