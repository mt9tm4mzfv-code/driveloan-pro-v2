name: UI-010 Syntax Fix

on:
  push:
    branches:
      - ui/next-update-010-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra UI-010 closure
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old='ENTRY WAS RESET..":"↻  RESET ENTRY"})]})}),y("div",{className:"mt-6'
          new='ENTRY WAS RESET..":"↻  RESET ENTRY"})]}),y("div",{className:"mt-6'
          if old not in text:
              raise SystemExit('UI-010 extra-closure anchor not found')
          text=text.replace(old,new,1)
          if old in text: raise SystemExit('extra closure still present')
          scripts=re.findall(r'<script type="module">(.*?)</script>',text,re.S)
          assert len(scripts)==1
          Path('/tmp/app.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/app.js'],check=True)
          assert '[resetWasClicked,setResetWasClicked]=V.useState(!1)' in text
          assert 'resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"' in text
          path.write_text(text,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','index.html'])
          subprocess.run(['git','rm','.github/workflows/ui-010-fix-syntax.yml','UI-010-SYNTAX-TRIGGER.txt'])
          subprocess.run(['git','commit','-m','UI-010 DEBUG: fix extra reset button closure'],check=True)
          subprocess.run(['git','push','origin','HEAD:ui/next-update-010-fix'],check=True)
