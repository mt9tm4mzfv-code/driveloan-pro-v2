name: Fix floating header body width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match floating header to calculator body width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'max-w-[980px]'
          new = 'max-w-[920px]'
          count = s.count(old)
          print(f'Found {count} occurrences of {old}')
          if count < 2:
              raise SystemExit('Expected header class and generated CSS utility; refusing partial edit.')
          s = s.replace(old, new)
          p.write_text(s)
          print('Changed all matching header width utility references to 920px.')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match floating header width to calculator body"
          git rm .github/workflows/fix-floating-header-body-width.yml
          git commit -m "Remove temporary header width workflow"
          git push
