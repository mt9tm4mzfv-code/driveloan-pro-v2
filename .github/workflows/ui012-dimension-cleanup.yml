name: UI-012 dimension cleanup

on:
  push:
    branches:
      - ui/next-update-012

permissions:
  contents: write

jobs:
  dimension-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact dimension-only cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
            ('},children:Ho==="simple"?"COPIED!":"COPY SIMPLE COMPUTATION"})', ',width:"100%",height:"44px",boxSizing:"border-box"},children:Ho==="simple"?"COPIED!":"COPY SIMPLE COMPUTATION"})'),
            ('},children:"GENERATE AMORTIZATION COMPARO"})', ',height:"44px",boxSizing:"border-box"},children:"GENERATE AMORTIZATION COMPARO"})'),
            ('},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})', ',width:"calc(100% - 2rem)",height:"44px",boxSizing:"border-box",marginLeft:"1rem",marginRight:"1rem"},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})')
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 target boundary, found {count}: {old}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          print('Applied exactly 3 dimension-only button changes.')
          PY

      - name: Verify exact scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          if s.count('height:"44px"') != 3:
              raise SystemExit(f'Expected exactly 3 button height rules; found {s.count("height:\"44px\"")}')
          if s.count('width:"calc(100% - 2rem)"') != 2:
              raise SystemExit('Expected exactly two shared outer width rules for Generate and Reset.')
          if s.count('width:"100%",height:"44px",boxSizing:"border-box"') != 1:
              raise SystemExit('Expected exactly one Copy Simple dimension rule.')
          print('Scope verification passed: exactly three button dimension updates.')
          PY

      - name: Commit and push exact change, then remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui012-dimension-cleanup.yml .github/workflows/ui012-apply.yml
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- index.html
          git commit -m "UI-012: make action button dimensions uniform"
          git push origin HEAD:ui/next-update-012
