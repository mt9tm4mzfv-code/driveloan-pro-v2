name: UI-012 dimension cleanup

on:
  push:
    branches:
      - ui/next-update-012

permissions:
  contents: write

jobs:
  dimension-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact dimension-only cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          replacements = [
          ('},children:Ho==="simple"?"COPIED!":"COPY SIMPLE COMPUTATION"})', ',width:"100%",height:"44px",boxSizing:"border-box"},children:Ho==="simple"?"COPIED!":"COPY SIMPLE COMPUTATION"})'),
          ('},children:"GENERATE AMORTIZATION COMPARO"})', ',height:"44px",boxSizing:"border-box"},children:"GENERATE AMORTIZATION COMPARO"})'),
          ('},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})', ',width:"calc(100% - 2rem)",height:"44px",boxSizing:"border-box",marginLeft:"1rem",marginRight:"1rem"},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})')]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly 1 target boundary, found {s.count(old)}: {old}')
              s=s.replace(old,new,1)
          path.write_text(s,encoding='utf-8')
          print('Applied exactly 3 dimension-only button changes.')
          PY

      - name: Verify index diff only
        run: |
          git diff --check
          test "$(git diff --numstat -- index.html | awk '{print $1+$2}')" = "2"
          test "$(git diff -- index.html | grep -o 'height:\"44px\"' | wc -l | tr -d ' ')" = "3"
          test "$(git diff -- index.html | grep -o 'width:\"calc(100% - 2rem)\"' | wc -l | tr -d ' ')" = "2"
          echo "Verification passed: index.html only, exactly 3 height updates and 2 shared outer width rules."

      - name: Commit and push exact change, then remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui012-dimension-cleanup.yml .github/workflows/ui012-apply.yml
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- index.html
          git commit -m "UI-012: make action button dimensions uniform"
          git push origin HEAD:ui/next-update-012
