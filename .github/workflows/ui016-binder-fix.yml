name: UI-016 binder fix

on:
  push:
    branches: [ui/next-update-016-debug]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: ui/next-update-016-debug
          fetch-depth: 0
      - name: Fix UI-016 binder timing only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          pattern = r'<script id="UI-016-THEME-BINDER">.*?</script>'
          replacement = '''<script id="UI-016-THEME-BINDER">
          (function(){
            function apply(){
              if(!document.body)return;
              var txt=document.body.innerText||"";
              var n=1, m=txt.match(/CALCULATOR\\s*[—-]\\s*(1|2|3)/i);
              if(m)n=Number(m[1]);
              document.body.classList.remove("ui016-calc1","ui016-calc2","ui016-calc3");
              document.body.classList.add("ui016-calc"+n);
            }
            function start(){
              apply();
              new MutationObserver(apply).observe(document.body,{subtree:true,childList:true,characterData:true});
            }
            if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",start);
            else start();
          })();
          </script>'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'UI-016 binder block count={count}, expected 1')
          p.write_text(s2)
          PY
          grep -q 'UI-016-PREMIUM-THEME' index.html
          grep -q 'UI-016-THEME-BINDER' index.html
          grep -q 'DOMContentLoaded' index.html
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script id="UI-016-THEME-BINDER">(.*?)</script>',s,re.S)
          print(m.group(1) if m else '')
          PY
          )
          echo 'UI-016 binder timing verification: PASS'
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI-016 debug: fix theme binder timing'
          git rm .github/workflows/ui016-binder-fix.yml
          git commit -m 'chore: remove temporary UI-016 binder workflow'
          git push origin HEAD:ui/next-update-016-debug
