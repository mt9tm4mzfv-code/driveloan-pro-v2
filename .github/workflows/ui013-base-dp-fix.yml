name: UI-013 Base DP Fix

on:
  push:
    branches:
      - ui/next-update-013

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Base DP binding fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              'Qe=R*0.8*1.17+se,Ge=Math.max(0,Math.min(L,Qe))',
              'Qe=R*(1-g/100)*1.17+se,Ge=Math.max(0,Math.min(L,Qe))'
            ),
            (
              'Pt=R-Ge-sn,an=sn*(1+G/100),Rn=an/U,cu=Math.ceil(Rn),xr=sn,qn=R-sn,Fr=R*0.2',
              'Pt=R-Ge-sn,an=sn*(1+G/100),Rn=an/U,cu=Math.ceil(Rn),xr=sn,qn=R-sn,Fr=R*(g/100)'
            ),
            (
              'Qe=R*0.8*1.17+se,Ge=R*(L/100)',
              'Qe=R*(1-g/100)*1.17+se,Ge=R*(L/100)'
            ),
            (
              'Zo=R*0.2,ed=(R-an)*0.17',
              'Zo=R*(g/100),ed=(R-an)*0.17'
            ),
            (
              'let L=R*0.8*1.17+se,U=We*1.17/(1+a/100)',
              'let L=R*(1-g/100)*1.17+se,U=We*1.17/(1+a/100)'
            ),
            (
              'RB = S×0.8×1.17+OPDP',
              'RB = S×(1-BDP%)×1.17+OPDP'
            )
          ]

          changed = False
          for old, new in replacements:
              count = s.count(old)
              if count:
                  s = s.replace(old, new)
                  changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
              print('UI-013 exact Base DP replacements applied.')
          else:
              print('UI-013 patch already applied; no source rewrite needed.')
          PY

      - name: Verify financial binding targets
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
            'Qe=R*(1-g/100)*1.17+se',
            'Fr=R*(g/100)',
            'Zo=R*(g/100)',
            'let L=R*(1-g/100)*1.17+se'
          ]
          for x in required:
              assert x in s, f'Missing verified target: {x}'
          assert 'Qe=R*0.8*1.17+se' not in s
          assert 'Qe=R*0.8*1.17+se,Ge=R*(L/100)' not in s
          print('Verified: Base DP state g is consumed by forward/reverse computation paths.')
          PY

      - name: Commit and push exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No index.html changes pending; fix is already applied."
          else
            git diff --cached --stat
            git commit -m "UI-013: fix Base Down Payment computation binding"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/ui013-base-dp-fix.yml
          git commit -m "UI-013: remove temporary fix workflow"
          git push
