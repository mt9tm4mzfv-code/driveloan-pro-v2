name: Cleanup UI Fix 012

on:
  page_build:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove test artifacts and workflow
        shell: bash
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/cleanup-ui-fix-012.yml .ui-fix-012-commit-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean UI verification artifacts'
          git push origin main
