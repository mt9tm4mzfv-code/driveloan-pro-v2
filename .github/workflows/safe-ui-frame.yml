name: Safe UI Frame Patch

on:
  push:
    branches:
      - safe-ui-frame-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply CSS-only UI frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* DRIVELOAN-SAFE-FRAME-001 */'
          if marker in s:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)
          anchor = '</head>'
          if anchor not in s:
              raise SystemExit('ABORT: </head> anchor not found')
          css = '''\n<style id="driveloan-safe-frame">\n/* DRIVELOAN-SAFE-FRAME-001 */\nhtml, body { background: #080c18 !important; }\nbody::before { content: ""; position: fixed; inset: 7px; border: 1.5px solid transparent; border-image: linear-gradient(135deg, #3b82f6 0%, #7ee0a0 50%, #f59e0b 100%) 1; border-radius: 18px; pointer-events: none; z-index: 2147483647; box-sizing: border-box; }\n@media (max-width: 640px) { body::before { inset: 5px; border-width: 1.5px; } }\n</style>\n'''
          s = s.replace(anchor, css + anchor, 1)
          p.write_text(s, encoding='utf-8')
          print('CSS-only frame patch applied.')
          PY
      - name: Validate HTML and JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['<!DOCTYPE html>', '<html', '<head', '</head>', '<body', '</body>', '</html>', 'DRIVELOAN-SAFE-FRAME-001']
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit('VALIDATION FAILED: missing ' + ', '.join(missing))
          if s.count('DRIVELOAN-SAFE-FRAME-001') != 1: raise SystemExit('VALIDATION FAILED: marker count is not 1')
          print('HTML validation passed.')
          PY
          python3 - <<'PY'
          import re, subprocess, tempfile, os
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          checked = 0
          for i, js in enumerate(scripts):
              if not js.strip(): continue
              f = tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8')
              f.write(js); f.close()
              r = subprocess.run(['node','--check',f.name], text=True, capture_output=True)
              os.unlink(f.name)
              if r.returncode != 0:
                  print(r.stderr); raise SystemExit(f'VALIDATION FAILED: script {i} syntax error')
              checked += 1
          print(f'JavaScript syntax validation passed for {checked} inline script block(s).')
          PY
      - name: Commit validated patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/safe-ui-frame.yml
          git add index.html .github/workflows/safe-ui-frame.yml
          git commit -m "ui: add safe CSS-only outer frame"
          git push origin HEAD:safe-ui-frame-20260908
