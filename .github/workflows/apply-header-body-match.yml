name: Apply header body width match

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match floating header to body geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'w-[calc(100%-32px)] max-w-[980px]'
          new = 'w-[calc(100%-80px)] max-w-[520px]'
          if old not in s:
              raise SystemExit('Expected floating-header width signature not found; aborting.')
          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('No change applied; aborting.')
          p.write_text(s2)
          PY

      - name: Verify exact change
        shell: bash
        run: |
          grep -o 'w-\[calc(100%-80px)\] max-w-\[520px\]' index.html
          if grep -q 'w-\[calc(100%-32px)\] max-w-\[980px\]' index.html; then
            echo 'Old header width signature still present.'
            exit 1
          fi

      - name: Commit UI change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match floating header width to calculator body'
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-header-body-match.yml
          git commit -m 'Remove temporary header body match workflow'
          git push
