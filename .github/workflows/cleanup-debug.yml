name: Cleanup debug workflows
on:
  push:
    branches: [fix-live-render-v3-20260908]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary validation workflows
        run: |
          rm -f .github/workflows/validate-render-v3.yml .github/workflows/validate-render-v4.yml .github/workflows/final-smoke-v5.yml .github/workflows/cleanup-debug.yml
          git config user.name 'Jude@Github2026'
          git config user.email 'jude.dante@gmail.com'
          git add -A .github/workflows
          git commit -m 'chore: remove temporary debug workflows'
          git push origin HEAD:fix-live-render-v3-20260908
