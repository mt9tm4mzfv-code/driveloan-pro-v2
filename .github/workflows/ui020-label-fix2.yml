name: UI-020 Label Fix 2
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact rendered-label binder
        run: python3 -c "import base64; from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'Expected UI-020 binder not found; aborting safely.'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit fix and clean temporary workflow
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI-020 fix: target exact rendered field labels'
          git rm .github/workflows/ui020-label-fix2.yml
          git rm UI020-FIX2-TRIGGER.txt || true
          git commit -m 'chore: remove temporary UI-020 fix workflow'
          git push
