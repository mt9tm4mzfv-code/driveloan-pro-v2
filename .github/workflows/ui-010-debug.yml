name: UI-010 Debug Patch

on:
  push:
    branches:
      - debug/ui-010-safe-reset

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply safe UI-010 patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_state = '[Qf,ru]=V.useState(!1),[Ho,Tr]=V.useState(null),[lu,Vf]=V.useState(!1),[uu,Bf]=V.useState(!1)'
          new_state = old_state + ',[resetWasClicked,setResetWasClicked]=V.useState(!1)'
          if old_state not in text: raise SystemExit('state anchor not found')
          text = text.replace(old_state, new_state, 1)
          old_wrapper = 'p("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",style:'
          new_wrapper = 'p("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",onFocus:()=>{resetWasClicked&&setResetWasClicked(!1)},style:'
          if old_wrapper not in text: raise SystemExit('wrapper anchor not found')
          text = text.replace(old_wrapper, new_wrapper, 1)
          start_marker = 'y("div",{className:"flex flex-col gap-0 pt-0",children:'
          start = text.find(start_marker)
          if start < 0: raise SystemExit('action anchor not found')
          end_marker = '}),y("div",{className:"mt-6 bg-[#080c18]'
          end = text.find(end_marker, start)
          if end < 0: raise SystemExit('action end anchor not found')
          new_actions = 'y("div",{className:"flex flex-col gap-4 pt-0",children:[y("button",{onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"0"},children:"GENERATE AMORTIZATION COMPARO"}),y("button",{onClick:()=>{Gf();setResetWasClicked(!0)},className:`w-full rounded-full py-2.5 px-5 text-[11px] font-black tracking-[0.12em] transition-all active:translate-y-[2px] ${resetWasClicked?"bg-[#2a0f12]":"bg-[#0f172a]"}`,style:{borderWidth:2,borderColor:resetWasClicked?"#ef4444":Zf,color:resetWasClicked?"#f87171":Zf,boxShadow:resetWasClicked?"0 3px 0 #991b1b, 0 0 16px rgba(239,68,68,0.35)":`0 3px 0 ${Zf}, 0 0 12px ${Zf}55`},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})]})'
          text = text[:start] + new_actions + text[end:]
          for marker in ['resetWasClicked','ENTRY WAS RESET..','onFocus:()=>{resetWasClicked&&setResetWasClicked(!1)}','className:"flex flex-col gap-4 pt-0"']:
              if marker not in text: raise SystemExit('verification failed: '+marker)
          path.write_text(text, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'])
          subprocess.run(['git','rm','.github/workflows/ui-010-debug.yml'])
          subprocess.run(['git','commit','-m','UI-010 DEBUG: safe reset button interaction'], check=True)
          subprocess.run(['git','push','origin','HEAD:debug/ui-010-safe-reset'], check=True)
