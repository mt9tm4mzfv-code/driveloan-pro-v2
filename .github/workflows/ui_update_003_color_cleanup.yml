name: UI Update 003 - Color Cleanup

on:
  push:
    branches:
      - ui/next-update-003

permissions:
  contents: write

jobs:
  apply-ui-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: ui/next-update-003
          fetch-depth: 1

      - name: Apply exactly one UI update
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          title_old = 'p("div",{className:"text-[13px] font-bold leading-tight",children:qf})'
          title_new = 'p("div",{className:"text-[13px] font-bold leading-tight",style:{color:l},children:qf})'

          question_old = 'jf=e===1?`Kung mag Down Payment ko og ₱${$f(I)} pila akong monthly?`:e===2?`Kung mag Down Payment ko og ${P.toFixed(2)}%, pila akong monthly?`:`Pila ang needed nga down payment para mag monthly og ₱${$f(un)}?`'
          question_new = 'jf=e===1?`Kung mag Down Payment ko og ₱${$f(I)} pila akong monthly?`:e===2?`Kung mag DOWN PAYMENT ko og 30% pila ang akong monthly?`:`Pila ang needed nga down payment para mag monthly og ₱${$f(un)}?`'

          if text.count(title_old) != 1:
              raise SystemExit(f"Unexpected title target count: {text.count(title_old)}")
          if text.count(question_old) != 1:
              raise SystemExit(f"Unexpected question target count: {text.count(question_old)}")

          text = text.replace(title_old, title_new, 1)
          text = text.replace(question_old, question_new, 1)

          if text.count(title_new) != 1:
              raise SystemExit("Title replacement validation failed")
          if text.count(question_new) != 1:
              raise SystemExit("Question replacement validation failed")

          # Guardrails: preserve Calculator 1 and Calculator 3 sample questions exactly.
          if 'Kung mag Down Payment ko og ₱${$f(I)} pila akong monthly?' not in text:
              raise SystemExit("Calculator 1 sample question was changed")
          if 'Pila ang needed nga down payment para mag monthly og ₱${$f(un)}?' not in text:
              raise SystemExit("Calculator 3 sample question was changed")

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow before commit
        run: rm -f .github/workflows/ui_update_003_color_cleanup.yml

      - name: Commit only the approved UI change
        run: |
          git config user.name "Jude@Github2026"
          git config user.email "jude.dante@gmail.com"
          git add index.html
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "ui: color-code calculator titles and update calculator 2 sample question"
          git push origin HEAD:ui/next-update-003
