name: Patch live blank render
on:
  push:
    branches: [fix-live-blank-20260908]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace theme binder with non-observing binder
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pat=r'<script id="DRIVELOAN-THEME-ZOOM-BINDER">.*?</script>'
          replacement='''<script id="DRIVELOAN-THEME-ZOOM-BINDER">\n(function(){\n  function theme(){\n    var t='';\n    document.querySelectorAll('button').forEach(function(b){if((b.textContent||'').trim().match(/^CALC-0[123]$/)&&b.getAttribute('aria-current')==='true')t=(b.textContent||'').trim();});\n    if(!t){document.querySelectorAll('button').forEach(function(b){if((b.textContent||'').trim()==='CALC-01'&&b.className.includes('bg-'))t='CALC-01';if((b.textContent||'').trim()==='CALC-02'&&b.className.includes('bg-'))t='CALC-02';if((b.textContent||'').trim()==='CALC-03'&&b.className.includes('bg-'))t='CALC-03';});}\n    var a=t==='CALC-01'?'#4ade80':t==='CALC-03'?'#f59e0b':'#5aa8ff';\n    var g=t==='CALC-01'?'rgba(74,222,128,.55)':t==='CALC-03'?'rgba(245,158,11,.55)':'rgba(90,168,255,.55)';\n    var so=t==='CALC-01'?'rgba(74,222,128,.18)':t==='CALC-03'?'rgba(245,158,11,.18)':'rgba(90,168,255,.18)';\n    document.documentElement.style.setProperty('--dl-accent',a);document.documentElement.style.setProperty('--dl-glow',g);document.documentElement.style.setProperty('--dl-soft',so);\n    document.querySelectorAll('input[type="range"]').forEach(function(el){\n      el.classList.add('dl-theme-slider');\n      var min=Number(el.min||0),max=Number(el.max||100),val=Number(el.value||0),pct=max===min?0:((val-min)/(max-min))*100;\n      el.style.background='linear-gradient(to right,'+a+' 0%,'+a+' '+pct+'%,#2b3446 '+pct+'%,#2b3446 100%)';\n    });\n    document.querySelectorAll('button').forEach(function(b){\n      var txt=(b.textContent||'').trim();var p=b.parentElement;\n      if((txt==='ON'||txt==='OFF') && p && /PREMIUM COLOR SURCHARGE/i.test((p.parentElement||p).textContent||'')){if(txt==='ON')b.classList.add('dl-theme-control');else b.classList.remove('dl-theme-control');}\n    });\n  }\n  function apply(){try{theme();}catch(e){console.error('DriveLoan theme binder:',e);}}\n  function boot(){apply();setTimeout(apply,250);}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();\n  document.addEventListener('click',function(){setTimeout(apply,0);},{passive:true});\n  document.addEventListener('input',apply,{passive:true});\n  document.addEventListener('change',apply,{passive:true});\n})();\n</script>'''
          ns,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('theme binder not found exactly once')
          p.write_text(ns)
          print('patched',len(s),'->',len(ns))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'Jude@Github2026'
          git config user.email 'jude.dante@gmail.com'
          git add index.html
          git commit -m 'FIX: prevent UI binder render interference' || true
          rm -f .github/workflows/patch-live-blank.yml
          git add .github/workflows/patch-live-blank.yml
          git commit -m 'chore: remove temporary patch workflow' || true
          git push origin HEAD:fix-live-blank-20260908
