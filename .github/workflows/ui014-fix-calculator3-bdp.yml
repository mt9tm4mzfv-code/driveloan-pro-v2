name: UI-014 Calculator 3 Base DP Fix

on:
  push:
    branches:
      - ui/next-update-014

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact one-line dependency fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'It=V.useMemo(()=>{let L=R*(1-g/100)*1.17+se,U=We*1.17/(1+a/100),G=L-un*U;return{RB:L,Width:U,RequiredDP_raw:G}},[R,se,We,a,un])'
          new = 'It=V.useMemo(()=>{let L=R*(1-g/100)*1.17+se,U=We*1.17/(1+a/100),G=L-un*U;return{RB:L,Width:U,RequiredDP_raw:G}},[R,se,We,a,un,g])'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('UI-014 target fix applied: added g to Calculator 3 RequiredDP useMemo dependencies')

      - name: Syntax and target verification
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          target = 'It=V.useMemo(()=>{let L=R*(1-g/100)*1.17+se,U=We*1.17/(1+a/100),G=L-un*U;return{RB:L,Width:U,RequiredDP_raw:G}},[R,se,We,a,un,g])'
          assert s.count(target) == 1, 'UI-014 target dependency fix missing or duplicated'
          assert 'It=V.useMemo(()=>{let L=R*(1-g/100)*1.17+se,U=We*1.17/(1+a/100),G=L-un*U;return{RB:L,Width:U,RequiredDP_raw:G}},[R,se,We,a,un])' not in s, 'Old dependency list still present'
          print('Target verification PASS')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI-014: fix Calculator 3 Base DP slider dependency"
          git rm .github/workflows/ui014-fix-calculator3-bdp.yml
          git commit -m "UI-014: remove temporary fix workflow"
          git push origin HEAD:ui/next-update-014
