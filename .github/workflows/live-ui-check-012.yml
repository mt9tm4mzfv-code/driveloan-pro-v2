name: Live UI Check 012

on:
  page_build:
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live production geometry
        shell: bash
        run: |
          cat > live-check.js <<'EOF'
          const { chromium } = require('playwright');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await page.goto('https://mt9tm4mzfv-code.github.io/driveloan-pro-v2/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByRole('button', { name: 'COPY SIMPLE COMPUTATION' }).waitFor({ state: 'visible', timeout: 30000 });
            await page.getByRole('button', { name: 'GENERATE AMORTIZATION COMPARO' }).waitFor({ state: 'visible', timeout: 30000 });
            const copy = await page.getByRole('button', { name: 'COPY SIMPLE COMPUTATION' }).boundingBox();
            const gen = await page.getByRole('button', { name: 'GENERATE AMORTIZATION COMPARO' }).boundingBox();
            if (!copy || !gen) throw new Error('Live buttons could not be measured');
            const gap = gen.y - (copy.y + copy.height);
            console.log(JSON.stringify({url: page.url(), copy, gen, gap}, null, 2));
            if (gap < 6 || gap > 20) throw new Error(`LIVE GAP OUT OF RANGE: ${gap}px`);
            if (gen.y < copy.y + copy.height) throw new Error(`LIVE OVERLAP DETECTED: ${gap}px`);
            await page.screenshot({ path: 'live-ui-check-012.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          NODE_PATH="$PWD/node_modules" node live-check.js
      - name: Remove verification harness
        shell: bash
        run: |
          rm -rf node_modules package.json package-lock.json live-check.js live-ui-check-012.png .github/workflows/live-ui-check-012.yml .live-ui-check-012-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove live UI verification harness'
          git push origin main
