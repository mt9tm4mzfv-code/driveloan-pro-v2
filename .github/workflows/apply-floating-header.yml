name: Apply floating header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change sticky header to fixed floating header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'sticky top-3 z-50'
          new = 'fixed top-3 z-50'
          if old not in s:
              raise SystemExit('Expected header class was not found; no change applied.')
          s2 = s.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          print('Applied exactly one header positioning change: sticky -> fixed')
          PY
      - name: Commit header positioning change and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI: Make header floating' || exit 0
          git push
          git rm .github/workflows/apply-floating-header.yml
          git commit -m 'chore: remove temporary floating header workflow'
          git push
