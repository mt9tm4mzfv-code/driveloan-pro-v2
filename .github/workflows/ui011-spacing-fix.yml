name: UI-011 spacing fix

on:
  push:
    branches:
      - ui/next-update-011

permissions:
  contents: write

jobs:
  fix-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/next-update-011
          fetch-depth: 1

      - name: Apply exact spacing-only change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = 'className:"flex flex-col gap-4 pt-0"'
          new = 'className:"flex flex-col pt-0",style:{rowGap:"16px"}'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly 1 target, found {count}")
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit("Replacement verification failed")
          p.write_text(s, encoding="utf-8")
          PY
          grep -F 'className:"flex flex-col pt-0",style:{rowGap:"16px"}' index.html
          if grep -Fq 'className:"flex flex-col gap-4 pt-0"' index.html; then exit 1; fi

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Jude@Github2026"
          git config user.email "jude.dante@gmail.com"
          git add index.html
          git rm .github/workflows/ui011-spacing-fix.yml
          git commit -m "UI-011: fix uniform button spacing"
          git push origin HEAD:ui/next-update-011