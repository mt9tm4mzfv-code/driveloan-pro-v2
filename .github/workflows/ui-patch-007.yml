name: UI Patch 007

on:
  push:
    branches:
      - ui/next-update-007

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested button UI change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''className:"w-full mx-4 font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em] flex items-center justify-center gap-2",style:{backgroundColor:Zf,color:"#000"},children:[y("svg",{width:"14",height:"14",viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round",children:[p("path",{d:"M3 3v18h18"}),p("path",{d:"M7 16l4-4 4 4 4-8"})]}),"GENERATE AMORTIZATION COMPARISON"]}),p("div",{className:"h-8",children:null})'''
          new = '''className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em] mt-3",style:{backgroundColor:Zf,color:"#000"},children:"GENERATE AMORTIZATION COMPARO"}),p("div",{className:"h-4",children:null})'''
          if old not in s:
              raise SystemExit('Exact target not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: simplify amortization comparison button"
          git push origin HEAD:ui/next-update-007
