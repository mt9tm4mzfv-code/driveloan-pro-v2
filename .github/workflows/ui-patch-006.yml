name: UI Patch 006

on:
  push:
    branches:
      - ui/next-update-006

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact UI size match
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'className:"font-bold rounded-2xl py-3.5 text-[12px] tracking-wide flex items-center justify-center gap-2"'
          new = 'className:"w-full mx-4 font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em] flex items-center justify-center gap-2"'
          if old not in s:
              print('Target already patched or target not found; no change needed.')
              raise SystemExit(0)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/ui-patch-006-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/ui-patch-006-trigger
          git diff --cached --quiet && exit 0
          git commit -m "ui: match amortization comparison capsule size"
          git push origin HEAD:ui/next-update-006
