name: UI-016 Premium Calculator Themes
on:
  push:
    branches: [ui/next-update-016]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/next-update-016
          fetch-depth: 0
      - name: Apply UI-only theme layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'UI-016-PREMIUM-THEME' in s:
              raise SystemExit('UI-016 theme already present')
          marker = '</head>'
          css = r'''<style id="UI-016-PREMIUM-THEME">
          /* UI-016: visual-only premium theme layer. No computation/field/label changes. */
          html,body{background:#0A1210!important;color:#fff!important}
          body{font-family:Inter,"Space Grotesk","Satoshi",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
          #root{min-height:100vh}
          body.ui016-calc1{background:linear-gradient(145deg,#0A1210,#0F1E1A)!important}
          body.ui016-calc2{background:linear-gradient(145deg,#080E1A,#0F1C30)!important}
          body.ui016-calc3{background:linear-gradient(145deg,#120E07,#1E1A0F)!important}
          body.ui016-calc1 #root>div,body.ui016-calc2 #root>div,body.ui016-calc3 #root>div{background:transparent!important}
          body.ui016-calc1 #root>div>div{border-top:2px solid #A8E6BA!important}
          body.ui016-calc2 #root>div>div{border-top:2px solid #7AA8FF!important}
          body.ui016-calc3 #root>div>div{border-top:2px solid #FFC875!important}
          body.ui016-calc1 #root>div>div>div{background:rgba(255,255,255,.035)!important}
          body.ui016-calc2 #root>div>div>div{background:rgba(100,140,255,.035)!important}
          body.ui016-calc3 #root>div>div>div{background:rgba(255,200,100,.035)!important}
          body.ui016-calc1 .text-\[10px\]{color:#6B7F78!important;letter-spacing:.2em!important}
          body.ui016-calc2 .text-\[10px\]{color:#6B7FA3!important;letter-spacing:.2em!important}
          body.ui016-calc3 .text-\[10px\]{color:#8A7D68!important;letter-spacing:.2em!important}
          body.ui016-calc1 .text-\[13px\],body.ui016-calc1 .text-\[12px\],body.ui016-calc1 .text-\[11px\]{color:#fff}
          body.ui016-calc2 .text-\[13px\],body.ui016-calc2 .text-\[12px\],body.ui016-calc2 .text-\[11px\]{color:#fff}
          body.ui016-calc3 .text-\[13px\],body.ui016-calc3 .text-\[12px\],body.ui016-calc3 .text-\[11px\]{color:#FFF8E8}
          body.ui016-calc1 input[type=range]{background:#1E2E28!important}
          body.ui016-calc2 input[type=range]{background:#1A2A45!important}
          body.ui016-calc3 input[type=range]{background:#2A2212!important}
          body.ui016-calc1 input[type=range]::-webkit-slider-thumb{border-color:#0A1210!important;box-shadow:0 0 8px rgba(168,230,181,.55)!important;width:20px;height:20px}
          body.ui016-calc2 input[type=range]::-webkit-slider-thumb{border-color:#080E1A!important;box-shadow:0 0 8px rgba(122,168,255,.55)!important;width:20px;height:20px}
          body.ui016-calc3 input[type=range]::-webkit-slider-thumb{border-color:#120E07!important;box-shadow:0 0 8px rgba(255,200,117,.55)!important;width:20px;height:20px}
          body.ui016-calc1 input[type=range]::-moz-range-thumb{border-color:#0A1210!important;box-shadow:0 0 8px rgba(168,230,181,.55)!important;width:20px;height:20px}
          body.ui016-calc2 input[type=range]::-moz-range-thumb{border-color:#080E1A!important;box-shadow:0 0 8px rgba(122,168,255,.55)!important;width:20px;height:20px}
          body.ui016-calc3 input[type=range]::-moz-range-thumb{border-color:#120E07!important;box-shadow:0 0 8px rgba(255,200,117,.55)!important;width:20px;height:20px}
          body.ui016-calc1 input:focus,body.ui016-calc1 select:focus{border-color:#A8E6BA!important;box-shadow:0 0 0 3px rgba(168,230,181,.15)!important}
          body.ui016-calc2 input:focus,body.ui016-calc2 select:focus{border-color:#7AA8FF!important;box-shadow:0 0 0 3px rgba(122,168,255,.15)!important}
          body.ui016-calc3 input:focus,body.ui016-calc3 select:focus{border-color:#FFC875!important;box-shadow:0 0 0 3px rgba(255,200,117,.15)!important}
          body.ui016-calc1 button{font-family:Inter,"Space Grotesk",system-ui,sans-serif!important}
          body.ui016-calc2 button{font-family:Inter,"Space Grotesk",system-ui,sans-serif!important}
          body.ui016-calc3 button{font-family:Inter,"Space Grotesk",system-ui,sans-serif!important}
          body.ui016-calc1 button[aria-label="Toggle Premium Color"]{box-shadow:0 0 0 1px rgba(168,230,181,.25)!important}
          body.ui016-calc2 .bg-\[\#131c31\],body.ui016-calc2 .bg-\[\#151e32\],body.ui016-calc2 .bg-\[\#0f172a\]{background-color:rgba(100,140,255,.06)!important;border-color:rgba(120,170,255,.15)!important}
          body.ui016-calc1 .bg-\[\#131c31\],body.ui016-calc1 .bg-\[\#151e32\],body.ui016-calc1 .bg-\[\#0f172a\]{background-color:rgba(255,255,255,.06)!important;border-color:rgba(168,230,181,.15)!important}
          body.ui016-calc3 .bg-\[\#131c31\],body.ui016-calc3 .bg-\[\#151e32\],body.ui016-calc3 .bg-\[\#0f172a\]{background-color:rgba(255,200,100,.06)!important;border-color:rgba(255,200,120,.15)!important}
          body.ui016-calc1 .bg-\[\#0a0f1e\],body.ui016-calc1 .bg-\[\#080c18\]{background:rgba(0,0,0,.22)!important;border-color:rgba(168,230,181,.12)!important}
          body.ui016-calc2 .bg-\[\#0a0f1e\],body.ui016-calc2 .bg-\[\#080c18\]{background:rgba(0,0,0,.22)!important;border-color:rgba(122,168,255,.12)!important}
          body.ui016-calc3 .bg-\[\#0a0f1e\],body.ui016-calc3 .bg-\[\#080c18\]{background:rgba(0,0,0,.22)!important;border-color:rgba(255,200,120,.12)!important}
          body.ui016-calc1 .text-\[\#7ee0a0\],body.ui016-calc1 .bg-\[\#7ee0a0\],body.ui016-calc1 .bg-\[\#86efac\]{color:#A8E6BA!important;background-color:#A8E6BA!important}
          body.ui016-calc2 .text-\[\#5aa8ff\],body.ui016-calc2 .bg-\[\#5aa8ff\],body.ui016-calc2 .bg-\[\#93c5fd\]{color:#080E1A!important;background-color:#7AA8FF!important}
          body.ui016-calc3 .text-\[\#f59e0b\],body.ui016-calc3 .bg-\[\#f59e0b\],body.ui016-calc3 .bg-\[\#fdba74\]{color:#120E07!important;background:#FFC875!important}
          </style>'''
          js = r'''<script id="UI-016-THEME-BINDER">
          (function(){
            function apply(){
              var txt=document.body.innerText||"";
              var n=1, m=txt.match(/CALCULATOR\s*[—-]\s*(1|2|3)/i);
              if(m)n=Number(m[1]);
              document.body.classList.remove("ui016-calc1","ui016-calc2","ui016-calc3");
              document.body.classList.add("ui016-calc"+n);
            }
            apply();
            new MutationObserver(apply).observe(document.body,{subtree:true,childList:true,characterData:true});
          })();
          </script>'''
          if marker not in s: raise SystemExit('head marker missing')
          s = s.replace(marker, css + js + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Verify UI-only scope and syntax
        run: |
          test -n "$(grep -o 'UI-016-PREMIUM-THEME' index.html)"
          test -n "$(grep -o 'UI-016-THEME-BINDER' index.html)"
          ! grep -q '0.17\|1.17' /dev/null
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('UI-016-PREMIUM-THEME') == 1
          assert s.count('UI-016-THEME-BINDER') == 1
          assert '</html>' in s and '</script>' in s
          print('UI-016 integrity check: PASS')
          PY
      - name: Commit UI-016
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI-016: apply premium calculator themes"
          git push origin ui/next-update-016
