name: UI-010 Reset Updater

on:
  push:
    branches:
      - ui/next-update-010

permissions:
  contents: write

jobs:
  update-reset-entry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ui/next-update-010
          fetch-depth: 1

      - name: Apply UI-010 Reset Entry update
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_state = '[Qf,ru]=V.useState(!1),[Ho,Tr]=V.useState(null),[lu,Vf]=V.useState(!1),[uu,Bf]=V.useState(!1)'
          new_state = '[Qf,ru]=V.useState(!1),[Ho,Tr]=V.useState(null),[lu,Vf]=V.useState(!1),[uu,Bf]=V.useState(!1),[resetWasClicked,setResetWasClicked]=V.useState(!1)'
          if old_state not in text:
              raise SystemExit('UI-010 state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_wrapper = 'y("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf},children:y("div",{className:"p-4",children:'
          new_wrapper = 'y("div",{className:"mt-4 bg-[#131c31] border border-[#2a3655] rounded-[20px] overflow-hidden",onChange:()=>{resetWasClicked&&setResetWasClicked(!1)},style:{borderLeftWidth:6,borderLeftColor:Zf,borderRightWidth:6,borderRightColor:Zf,borderTopWidth:6,borderTopColor:Zf,borderBottomWidth:6,borderBottomColor:Zf},children:y("div",{className:"p-4",children:'
          if old_wrapper not in text:
              raise SystemExit('UI-010 wrapper anchor not found')
          text = text.replace(old_wrapper, new_wrapper, 1)

          old_actions = 'y("div",{className:"flex flex-col gap-0 pt-0",children:[y("button",{onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"-1.5rem"},children:"GENERATE AMORTIZATION COMPARO"}),p("div",{className:"h-4",children:null}),p("button",{onClick:()=>{Gf();window.alert("ENTRY RESET")},className:"bg-[#0f172a] rounded-[14px] py-2.5 px-5 text-[11px] font-black tracking-wide transition-transform active:translate-y-[2px]",style:{borderWidth:1,borderColor:Zf,color:Zf,boxShadow:`0 3px 0 ${Zf}`},children:"RESET ENTRY"})]})'
          new_actions = 'y("div",{className:"flex flex-col gap-0 pt-0",children:[y("button",{onClick:()=>ru(!0),className:"w-full font-bold rounded-2xl py-2.5 text-[11px] tracking-[0.12em]",style:{backgroundColor:Zf,color:"#000",width:"calc(100% - 2rem)",marginLeft:"1rem",marginRight:"1rem",marginTop:"0"},children:"GENERATE AMORTIZATION COMPARO"}),p("div",{className:"h-4",children:null}),p("button",{onClick:()=>{Gf();setResetWasClicked(!0)},className:`w-full rounded-full py-2.5 px-5 text-[11px] font-black tracking-[0.12em] transition-all active:translate-y-[2px] ${resetWasClicked?"bg-[#2a0f12]":"bg-[#0f172a]"}`,style:{borderWidth:2,borderColor:resetWasClicked?"#ef4444":Zf,color:resetWasClicked?"#f87171":Zf,boxShadow:resetWasClicked?"0 3px 0 #991b1b, 0 0 16px rgba(239,68,68,0.35)":`0 3px 0 ${Zf}, 0 0 12px ${Zf}55`},children:resetWasClicked?"✓  ENTRY WAS RESET..":"↻  RESET ENTRY"})]})'
          if old_actions not in text:
              raise SystemExit('UI-010 action block anchor not found')
          text = text.replace(old_actions, new_actions, 1)

          path.write_text(text, encoding='utf-8')
          print('UI-010 reset update applied')

      - name: Verify UI-010 markers
        shell: bash
        run: |
          grep -q 'ENTRY WAS RESET..' index.html
          grep -q 'resetWasClicked' index.html
          grep -q 'onChange:()=>{resetWasClicked&&setResetWasClicked(!1)}' index.html
          echo 'UI-010 verification passed'

      - name: Commit and push update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'UI-010-RESET: compact 3D reset entry state flow' || exit 0
          git push origin HEAD:ui/next-update-010
