name: UI-020 Fix

on:
  push:
    branches:
      - future-update-point-ui020-fix-2026-09-08

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI-020 selector fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function apply(){document.querySelectorAll('div').forEach(function(el){if(el.children.length!==0)return;var txt=(el.textContent||'').trim();if(!labels.has(txt))return;if(!el.className||String(el.className).indexOf('text-[10px]')===-1)return;el.classList.add('dl-ui020-field-label')})}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();"
          new = "function apply(){document.querySelectorAll('div,p,span,label').forEach(function(el){if(el.children.length!==0)return;var txt=(el.textContent||'').trim();if(!labels.has(txt))return;var c=String(el.className||'');if(c.indexOf('text-[10px]')===-1&&c.indexOf('text-[9px]')===-1)return;el.classList.add('dl-ui020-field-label')})}\n  function boot(){apply();var n=0,timer=setInterval(function(){apply();if(++n>=20)clearInterval(timer);},250);}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();"
          if old not in s:
              raise SystemExit('Expected UI-020 binder pattern not found; aborting without changes.')
          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('UI-020 binder replacement made no change; aborting.')
          p.write_text(s2, encoding='utf-8')
          print('UI-020 selector fix applied: div,p,span,label + text-[9px] support + 5s reapply window')
          PY

      - name: Commit index.html fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "UI-020 fix: bind themed field labels to rendered elements"
          git rm .github/workflows/ui020-fix.yml
          git commit -m "chore: remove temporary UI-020 fix workflow"
          git push
