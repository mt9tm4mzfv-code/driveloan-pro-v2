name: Next Update 001 — Continuous Calculator Border

on:
  push:
    branches:
      - ui/next-update-001

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add continuous top and bottom calculator border
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          original = s
          marker = 'Down Payment Amount'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Target marker not found')

          # Locate the calculator card by its nearby class/style rather than
          # trying to parse the full generated React call tree.
          window = s[max(0, pos-12000):pos+2000]
          print('TARGET WINDOW TAIL:')
          print(window[-5000:])
          print('SIDE BORDER TOKENS NEAR TARGET:')
          for m in re.finditer(r'[^,;]{0,180}(?:borderLeft|borderRight|border-l|border-r)[^,;]{0,180}', window):
              print(m.group(0))

          # The approved calculator card uses the active theme border token.
          # Find the nearest className containing the green active border token
          # before the title, then add only the missing horizontal border widths
          # to that same class/style declaration.
          token = 'border-[#7ee0a0]'
          token_pos = s.rfind(token, 0, pos)
          if token_pos < 0:
              raise SystemExit('Calculator 1 active border token not found')

          # Find the className string that contains the token.
          cm_start = s.rfind('className:"', 0, token_pos)
          if cm_start < 0:
              raise SystemExit('Containing className not found')
          cm_value_start = cm_start + len('className:"')
          cm_end = s.find('"', cm_value_start)
          if cm_end < 0 or cm_end < token_pos:
              raise SystemExit('Containing className end not found')
          classes = s[cm_value_start:cm_end]

          if 'border-t-[6px]' in classes or 'border-b-[6px]' in classes:
              raise SystemExit('Horizontal border utility already present')

          # Add horizontal 6px borders to this existing outer frame.
          new_classes = classes + ' border-t-[6px] border-b-[6px]'
          s = s[:cm_value_start] + new_classes + s[cm_end:]

          for required in [
              'DRIVELOAN PRO',
              'Down Payment Amount',
              'PREMIUM COLOR?',
              'OFFICIAL PROMO DP',
              'RESET ENTRY',
              'navigator.clipboard',
          ]:
              if required not in s:
                  raise SystemExit(f'Safety check failed: {required} missing')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for idx, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  name = f.name
              r = subprocess.run(['node','--check',name], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f'JavaScript syntax failed in script {idx}: {r.stderr}')

          path.write_text(s, encoding='utf-8')
          print(f'Bytes: {len(original.encode())} -> {len(s.encode())}')
          print('Applied continuous 6px top/bottom border to Calculator 1 outer frame only.')

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/next-update-001-continuous-border.yml
          git commit -m "ui: wrap calculator in continuous color border"
          git push origin ui/next-update-001
