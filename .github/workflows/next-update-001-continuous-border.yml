name: Next Update 001 — Continuous Calculator Border

on:
  push:
    branches:
      - ui/next-update-001

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect rendered calculator container
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          ret=s.find('return y("div"')
          print('return=',ret)
          print('--- first 14000 chars after return ---')
          print(s[ret:ret+14000])
