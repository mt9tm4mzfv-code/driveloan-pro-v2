name: Next Update 001 — Continuous Calculator Border

on:
  push:
    branches:
      - ui/next-update-001

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add continuous top and bottom calculator border
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          original = s

          marker = 'Down Payment Amount'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Target marker not found')

          def matching_end(text, start):
              depth = 0
              quote = None
              template = False
              i = start
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if ch == "\\":
                          i += 2
                          continue
                      if ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '`':
                      template = not template
                      i += 1
                      continue
                  if not template:
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              return i + 1
                  i += 1
              return None

          # Find the nearest enclosing y("div",{...}) that contains the
          # Calculator 1 title. This is the single outer calculator card,
          # not any of the individual input/clipboard segments.
          opener = 'y("div",{'
          starts = []
          scan = 0
          while True:
              p = s.find(opener, scan, pos + 1)
              if p < 0:
                  break
              starts.append(p)
              scan = p + 1

          target = None
          for start in reversed(starts):
              end = matching_end(s, start + 1)
              if end is not None and end > pos:
                  target = (start, end)
                  break

          if not target:
              raise SystemExit('Enclosing calculator card not found')

          start, end = target
          node = s[start:end]

          # Preserve the existing 6px left/right active-theme border and add
          # the same 6px horizontal borders, producing one continuous frame.
          # Do not alter any nested segment borders or calculation logic.
          if 'borderTopWidth:' in node or 'borderBottomWidth:' in node:
              raise SystemExit('Horizontal border already present; refusing duplicate change')

          style_match = re.search(r'style:\{([^{}]*)\}', node)
          if style_match:
              body = style_match.group(1)
              if 'borderLeftWidth:' not in body and 'borderRightWidth:' not in body:
                  raise SystemExit('Expected existing side-border style not found')
              new_body = body + ',borderTopWidth:"6px",borderBottomWidth:"6px"'
              node2 = node[:style_match.start(1)] + new_body + node[style_match.end(1):]
          else:
              # Fallback: add utility classes to the same outer card.
              cm = re.search(r'className:"([^"]*)"', node)
              if not cm:
                  raise SystemExit('Outer calculator className not found')
              classes = cm.group(1)
              if 'border-t-' in classes or 'border-b-' in classes:
                  raise SystemExit('Horizontal border utility already present')
              classes2 = classes + ' border-t-[6px] border-b-[6px]'
              node2 = node[:cm.start(1)] + classes2 + node[cm.end(1):]

          s = s[:start] + node2 + s[end:]

          if s == original:
              raise SystemExit('No change made')

          # Safety checks: only the outer calculator frame should change.
          for required in [
              'DRIVELOAN PRO',
              'Down Payment Amount',
              'PREMIUM COLOR?',
              'OFFICIAL PROMO DP',
              'RESET ENTRY',
              'navigator.clipboard',
          ]:
              if required not in s:
                  raise SystemExit(f'Safety check failed: {required} missing')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for idx, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  name = f.name
              r = subprocess.run(['node','--check',name], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f'JavaScript syntax failed in script {idx}: {r.stderr}')

          path.write_text(s, encoding='utf-8')
          print(f'Bytes: {len(original.encode())} -> {len(s.encode())}')
          print('Applied continuous 6px top/bottom border to the single outer calculator card.')

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/next-update-001-continuous-border.yml
          git commit -m "ui: wrap calculator in continuous color border"
          git push origin ui/next-update-001
